- id: rev-policy\n    resource: https://wiki.acme/finance/revenue-recognition\n    title: Revenue recognition policy\n---\n\n# Computation\n\n    SELECT SUM(amount) AS revenue\n    FROM finance.recognized_revenue\n    WHERE fiscal_year = @year\n\nThe computation binds only the declared `parameters`, per the recognition\npolicy.[^rev-policy]\n\n[^rev-policy]: Revenue recognition policy\n```\n\n### 10.3 The computation\n\nProvide the computation in one of two ways:\n\n- **Inline:** a single fenced code block in the body under `# Computation`.\n  Best for a short computation reviewed alongside the contract.\n- **File:** set `computation` to a path (\u00a76.2) and omit the body fence.\n  Best for a long or generated computation, or one already kept as a real\n  file shared with non-OKF tooling.\n\n```yaml\nruntime: bigquery\ncomputation: references/computations/lib/revenue.sql\nparameters:\n  - { name: year, type: integer, required: true }\n```\n\nThe agent MAY only supply *values* for the declared `parameters`; it MUST\nNOT author or edit the computation. Binding `computation` with the\nparameter values into the executable artifact is the consumer's job, and\nthe attester independently re-derives that same binding to compare against\nwhat actually ran. Because the comparison is on the expanded, compiled\nartifact the receipt carries (`executed_sql`, `compiled_sql`), a rewritten\nquery, a swapped computation file, or a mutated dependency fails the check.\nA typed, parameter-only surface is what makes \"did the sanctioned thing\nrun\" a mechanical comparison rather than a judgement call.\n\n### 10.4 Concepts that use a computation\n\nA document is rarely a single computation. An income-statement overview\nthat discusses revenue, profit, and margin stays one readable concept and\nlinks to one Attested Computation per figure:\n\n```markdown\n---\ntype: Metric\ntitle: Revenue\ndescription: Recognized revenue for a fiscal year.\ntags: [finance, revenue]\nstatus: stable\ngenerated: { by: reference_agent/gemini-2.5-pro, at: 2026-06-20T22:53:05Z }\n---\n\n# Definition\n\nRecognized revenue sums `amount` over rows booked to the fiscal year,\ncomputed by [the revenue computation](../computations/revenue.md).\n```\n\nBecause each computation is its own concept, revenue can be fresh while\nprofit is past its `stale_after`, and each attests on its own run.\nCo-locating them is a directory choice (a `computations/` folder with an\n`index.md`), not a frontmatter one.\n\n### 10.5 How a consumer uses it (informative)\n\nThis subsection is informative, not normative. The runtime artifacts below\nare **not** stored in the bundle.\n\n1. **Discover** via `type: Attested Computation`, a frontmatter signal\n   liftable into `index.md`; a consumer reaches one directly or by\n   following a link from a concept that uses it.\n2. **Load** the contract from frontmatter and the computation from the\n   body (or the file named by `computation`).\n3. **Parameterize**: the agent supplies values for the declared parameters.\n4. **Execute**: the executor runs the bound computation and returns a\n   receipt shaped by `executor.receipt`.\n5. **Attest**: the consumer runs the attester over the receipt. It\n   confirms provenance (the computation that ran equals `computation` bound\n   with the claimed parameters, not agent-authored SQL) and fidelity (the\n   displayed value matches the receipt's authoritative source, re-read by\n   job id rather than taken from the agent's text).\n6. **Gate**: refuse to display a failing attestation; warn or refuse when\n   `today >= stale_after`. On success, surface the verdict (for example a\n   link to the job log) so trust is visible.\n\n### 10.6 Verification versus attestation\n\n`verified` (\u00a75.2) and attestation are distinct, and both exist:\n\n- `verified` confirms the *definition* still matches policy. It is\n  doc-level, slow, and recorded in the bundle.\n- Attestation confirms a single *run* produced the value the sanctioned\n  way. It is per-call, runtime, and not stored in the bundle.\n\nA concept with a stale definition can still attest cleanly, and a\nfreshly-verified definition still requires attestation on each run, which\nis why both are needed.\n\n---\n\n## 11. Conformance\n\nA bundle is **conformant** with OKF v0.2 if:\n\n1. Every non-reserved `.md` file in the tree contains a parseable YAML\n   frontmatter block.\n2. Every frontmatter block contains a non-empty `type` field.\n3. Every reserved filename (`index.md`, `log.md`) follows the structure in\n   \u00a78 and \u00a79 respectively when present.\n\nWhen the trust, lifecycle, provenance, or computation families are\npresent, producers SHOULD follow \u00a75 through \u00a710, and consumers:\n\n- MUST treat a bare `verified` mapping as a one-element list (\u00a75.2).\n- MUST NOT reject a concept for missing any optional family (\u00a75.3).\n- SHOULD derive trust tiers and staleness only from the fields specified\n  here, and SHOULD surface, not silently drop, a failing attestation\n  (\u00a710.5).\n\nConsumers SHOULD treat all other constraints as soft guidance. In\nparticular, consumers MUST NOT reject a bundle because of:\n\n- Missing optional frontmatter fields.\n- Unknown `type` values.\n- Unknown additional frontmatter keys.\n- Broken cross-links.\n- Missing `index.md` files.\n\n---\n\n## 12. Versioning\n\nThis document specifies OKF version **0.2**. Revisions are versioned as\n`<major>.<minor>`:\n\n- A **minor** version bump introduces backward-compatible additions (new\n  optional fields, new conventional section headings).\n- A **major** version bump may make breaking changes (renaming required\n  fields, changing reserved filenames).\n\nBundles MAY declare the version they target with `okf_version: \"0.2\"` in a\nbundle-root `index.md` frontmatter block (the only place frontmatter is\npermitted in an `index.md`). Consumers that do not understand the declared\nversion SHOULD attempt best-effort consumption rather than refusing the\nbundle.\n\n### Considered and deferred\n\nThe following are intentionally left to a future revision:\n\n- The full runtime protocol: receipt and verdict wire formats, and the\n  attestation lifecycle around a run.\n- The attester ABI, portability, and sandboxing, likely bundled with\n  future work on serving and Skills.\n- Attestation caching.\n- Semantic-layer templates (Looker, dbt) where the attester comparison\n  shifts from SQL equality to model-and-binding equality.\n\n---\n\n## 13. Changes from v0.1\n\nv0.2 supersedes OKF v0.1 and is a minor version bump under \u00a712, except for\ntwo deliberate breaking changes called out below because they rename or\nretire v0.1 fields. A v0.1 bundle is consumable by a v0.2 consumer under\nthe fallbacks noted here.\n\n### 13.1 Breaking changes\n\n- **`timestamp` is superseded by `generated.at`.** A concept's last\n  content change is now recorded as `generated: { by, at }` (\u00a75.2).\n  Consumers MAY fall back to a legacy `timestamp` when `generated` is\n  absent.\n- **The body `# Citations` list is superseded by `sources`.** Provenance\n  moves to frontmatter (\u00a75.1). Consumers SHOULD read `sources` and MAY\n  still parse a legacy `# Citations` body list for v0.1 documents.\n\n### 13.2 Additive changes\n\nAll of the following are additive: new optional keys, one new concept\ntype, and one new conventional heading. Their absence yields a plain v0.1\nconcept.\n\n- New frontmatter families: `sources` with its per-source credibility\n  signals (`author`, `usage_count`, `last_modified`) and the `usage_window`\n  sibling; `generated`, `verified`; `status`, `stale_after` (\u00a75).\n- New concept type `Attested Computation` and its computation keys\n  `runtime`, `parameters`, `computation`, `executor`, `attester` (\u00a710).\n- New conventional body heading `# Computation` (\u00a74.2).\n- The actor convention for `generated.by` and `verified[].by` (\u00a77).\n\nEverything else (bundle structure, reserved filenames, the required\n`type`, recommended `title`/`description`/`resource`/`tags`, cross-linking,\nindex files, log files, permissive conformance) is carried forward\nunchanged.\n\n---\n\n## Appendix A: Worked example, an income statement\n\nOne bundle exercising every family, shown as a v0.1 to v0.2 migration of an\nincome statement with two figures, revenue and gross profit.\n\n### v0.1 form\n\nA single doc: both figures in one concept, the SQL in prose an agent can\nread, ignore, or rewrite, citations a flat list, and the only timestamp is\n`timestamp`.\n\n```markdown\n---\ntype: Metric\ntitle: Income statement (fiscal year)\ndescription: Headline income-statement figures for a fiscal year.\ntags: [finance, income-statement]\ntimestamp: '2026-05-28T22:53:05+00:00'\n---\n\n# Definition\nThe income statement reports revenue and gross profit for a fiscal year.\n\n# Revenue\nRecognized revenue sums `amount` over rows booked to the fiscal year:\n\n    SELECT SUM(amount) AS revenue\n    FROM finance.recognized_revenue\n    WHERE fiscal_year = <year>\n\n# Gross profit\nGross profit by segment, per the cost-allocation standard:\n\n    SELECT gross_profit FROM fct_income_statement\n    WHERE fiscal_year = <year> AND segment = <segment>\n\n# Citations\n- https://wiki.acme/finance/fpa-handbook\n- https://wiki.acme/finance/revenue-recognition\n- https://wiki.acme/finance/cost-allocation\n```\n\n### v0.2 form\n\nThe two figures split into attested computations linked from a narrative\nconcept. Every family is populated, and the two computations sit in\ndeliberately different states so one consumer reaches two verdicts.\n\n```\nbundles/finance/\n  metrics/income-statement.md      type: Metric  (narrates, links both)\n  computations/revenue.md          type: Attested Computation  (runtime: bigquery)\n  computations/profit.md           type: Attested Computation  (runtime: dbt)\n  references/skills/run-on-bq.md, run-dbt.md\n  references/attesters/sql-equality.py, dbt-binding.py\n```\n\n`metrics/income-statement.md`, the readable doc; trust lives on what it\nlinks, not here:\n\n```markdown\n---\ntype: Metric\ntitle: Income statement (fiscal year)\ndescription: Headline income-statement figures for a fiscal year.\ntags: [finance, income-statement]\nstatus: stable\ngenerated: { by: reference_agent/gemini-2.5-pro, at: 2026-06-20T22:53:05Z }\nverified: { by: human:ahormati, at: 2026-06-25T09:00:00Z }\nstale_after: 2026-12-31\nsources:\n  - id: fpa-handbook\n    resource: https://wiki.acme/finance/fpa-handbook\n    title: FP&A reporting handbook\n---\n\n# Definition\nThe income statement reports [revenue](../computations/revenue.md) and\n[gross profit](../computations/profit.md) for a fiscal year, per the FP&A\nreporting handbook.[^fpa-handbook] Each figure is produced by a sanctioned,\nattestable computation; this concept only narrates them.\n\n[^fpa-handbook]: FP&A reporting handbook\n```\n\n`computations/revenue.md`, BigQuery SQL, human-verified, fresh, and\ncorroborated by a live dashboard source carrying credibility signals:\n\n```markdown\n---\ntype: Attested Computation\ntitle: Revenue for fiscal year\ndescription: Recognized revenue for a fiscal year, per Finance's definition.\ntags: [finance, revenue]\nstatus: stable\nruntime: bigquery\nparameters:\n  - { name: year, type: integer, required: true }\nexecutor:\n  resource: references/skills/run-on-bq.md\n  receipt: [job_id, executed_sql, result]\nattester:\n  resource: references/attesters/sql-equality.py\ngenerated: { by: reference_agent/gemini-2.5-pro, at: 2026-06-28T14:00:00Z }\nverified: { by: human:ahormati, at: 2026-06-25T09:00:00Z }\nstale_after: 2026-12-31\nsources:\n  - id: rev-policy\n    resource: https://wiki.acme/finance/revenue-recognition\n    title: Revenue recognition policy\n    author: team:finance-fpa\n    last_modified: 2026-04-02\n  - id: exec-rev-dash\n    resource: dashboards/exec-revenue\n    title: Executive revenue dashboard\n    author: team:finance-fpa\n    usage_count: 5000\n    last_modified: 2026-06-18\nusage_window: { from: 2026-06-01, to: 2026-06-30 }\n---\n\n# Computation\n\n    SELECT SUM(amount) AS revenue\n    FROM finance.recognized_revenue\n    WHERE fiscal_year = @year\n\nRecognized revenue per the recognition policy,[^rev-policy] corroborated by\nthe executive revenue dashboard.[^exec-rev-dash]\n\n[^rev-policy]: Revenue recognition policy\n[^exec-rev-dash]: Executive revenue dashboard\n```\n\n`computations/profit.md`, a dbt model, process-verified, and past its\n`stale_after`:\n\n```markdown\n---\ntype: Attested Computation\ntitle: Gross profit for fiscal year\ndescription: Gross profit by segment for a fiscal year, per the cost-allocation standard.\ntags: [finance, profit]\nstatus: stable\nruntime: dbt\nparameters:\n  - { name: year, type: integer, required: true }\n  - { name: segment, type: string, required: true }\nexecutor:\n  resource: references/skills/run-dbt.md\n  receipt: [run_id, compiled_sql, result]\nattester:\n  resource: references/attesters/dbt-binding.py\ngenerated: { by: reference_agent/gemini-2.5-pro, at: 2026-06-14T14:00:00Z }\nverified: { by: process:finance-nightly, at: 2026-06-12T08:00:00Z }\nstale_after: 2026-06-15\nsources:\n  - id: cost-alloc\n    resource: https://wiki.acme/finance/cost-allocation\n    title: Cost allocation standard\n---\n\n# Computation\n\n    SELECT gross_profit\n    FROM {{ ref('fct_income_statement') }}\n    WHERE fiscal_year = {{ var('year') }}\n      AND segment = {{ var('segment') }}\n\nGross profit by segment per the cost-allocation standard.[^cost-alloc]\n\n[^cost-alloc]: Cost allocation standard\n```", "log": "# Work Log\n\nAppend-only audit trail. Add one dated entry per turn that creates, edits, or restructures content. The knowledge-base skill describes what to log and the entry shape.\n\n## 2026-07-30: Reusable note \u2014 auto-updating progress card\n\n- Saved the stat-card hook as a how-to note: [auto-updating-progress-card-pre-commit-hook](./notes/auto-updating-progress-card-pre-commit-hook.md) \u2014 full script, install one-liner, reuse checklist, verification record; linked from [index](./index.md)\n\n## 2026-07-30: Progress stat card + auto-update hook\n\n- Updated the plan's stat card to real counts: [personal-wiki-setup-plan](./plans/personal-wiki-setup-plan.md) \u2014 total 171 (180 raw \u2212 9 superseded), completed 29, remaining 142\n- Added `scripts/update-plan-stats.sh` (bash, cross-platform) + `.git/hooks/pre-commit` in the wiki repo \u2014 recomputes the card whenever the plan is staged, so progress numbers can never go stale\n\n## 2026-07-30: Vercel pipeline fixed \u2014 Task 1.2 verified\n\n- Test publish round-trip on my-digital-garden revealed Node.js 18.x discontinued; fixed via branch + PR #24 (`engines: node >=22`), merged, Vercel builds green (29s prod, 32s preview), live site verified serving updated content\n- Local build verified first: `npm install` + `npm run build` exit 0 on Node v24.15.0 (117 files / 133 assets)\n- Marked Task 1.2 \u2705 DONE in [personal-wiki-setup-plan](./plans/personal-wiki-setup-plan.md)\n- Committed the plan-file deletion in my-digital-garden (plan lives here in [plans/](./plans/))\n- Open follow-ups: 1.6 backup iCloud vault, 1.3-1.4 QMD install + index, Phase 3 first migration batch\n\n## 2026-07-30: Frontmatter conventions, folder defaults, RESOLVER\n\n- Created [frontmatter-conventions](./concepts/frontmatter-conventions.md) concept doc \u2014 YAML schema with `public: true/false` (replaces `dg-publish`), copy script transformation rules, tag conventions, per-folder defaults\n- Updated all 7 folder `.ok/frontmatter.yml` files with default `type` and `public: false` (Phase 2.4)\n- Created [RESOLVER.md](./RESOLVER.md) \u2014 filing decision tree for where new notes go (Phase 2.5)\n- Open follow-ups: Phase 1.2 (verify Vercel), 1.6 (backup vault), 1.3-1.4 (QMD install + index)\n\n## 2026-07-30: Reorganize wiki \u2014 adopt OKF, two-repo architecture\n\n- Added OKF frontmatter (`type: source`, `resource`, `generated`) to three files in `external-sources/`: OKF blog post, OKF README, OKF SPEC\n- Created [plans/](./plans/) folder with `.ok/frontmatter.yml` (`type: plan`)\n- Moved [personal-wiki-setup-plan](./plans/personal-wiki-setup-plan.md) from my-digital-garden repo; updated for two-repo architecture (wiki = source of truth, my-digital-garden = publishing consumer)\n- Created [wiki-architecture](./concepts/wiki-architecture.md) concept doc \u2014 central wiki repo + multiple publishing consumers pattern\n- Open follow-ups: remove plan from my-digital-garden repo, write copy script (Phase 5.4), update welcome.md\n\n## 2026-07-29\n\n- Created [[pi-acp-ollama-connection-error]] (`notes/`) \u2014 fix for OK web app's 'New Pi ACP chat' failing with empty retries; root cause was the local Ollama daemon not running when the `pi-acp` subprocess launched.\n- Created [[add-ollama-cloud-model-to-pi-acp]] (`notes/`) \u2014 Q&A on which files to edit (`~/.pi/agent/models.json` + `settings.json`) to add a new Ollama cloud model to the ACP dropdown.", "notes/add-ollama-cloud-model-to-pi-acp": "# Add an Ollama cloud model to the Pi ACP dropdown\n\n## Q \u2014 What do I edit to add a new cloud model?\n\nTwo files in `~/.pi/agent/` (Windows: `C:\\Users\\<you>\\.pi\\agent\\`):\n\n1. **`models.json`** \u2014 add an object to `providers.ollama.models[]`:\n   ```json\n   { \"id\": \"kimi-k3:cloud\", \"contextWindow\": 1000000,\n     \"input\": [\"text\", \"image\"], \"reasoning\": true }\n   ```\n2. **`settings.json`** \u2014 add `\"ollama/<id>\"` to the `enabledModels` array.\n\nThen **restart the ACP chat** (close it, click *New Pi ACP chat* again) \u2014 `pi --mode rpc` reads `models.json` only at startup.\n\n## Entry fields\n- `id` (Ollama tag; cloud ends `:cloud`); `contextWindow` (library page or `ollama show`); `input` `[\"text\"]`/`[\"text\",\"image\"]`; `reasoning` `true` if thinking-capable.\n- **Omit `_launch`** so the entry is user-managed and survives `ollama launch pi --config`.\n\n## Context\n- ACP **Model dropdown = `providers.ollama.models[]`** from `models.json` \u2014 the only file the selector reads.\n- Capabilities: `ollama.com/library/<model>` or `curl http://127.0.0.1:11434/api/show -d '{\"model\":\"<id>\"}'`.\n- **Blessed alternative:** `ollama launch pi --model <id>:cloud --config`.\n- See [[pi-acp-ollama-connection-error]] for why the daemon must be running first.", "notes/agent-skills-index": "\n## coreyhaines31/makerskills\n\n<https://github.com/coreyhaines31/makerskills>\n\nRouting table for common operator jobs. Match your intent \u2192 skill.\n\n| I want to... | Skill |\n| --- | --- |\n| Think through a decision with a real fork | [`decide`](./skills/decide/SKILL.md) |\n| Break through a wall (\"this seems impossible\") | [`unstuck`](./skills/unstuck/SKILL.md) |\n| Pressure-test a new business or product idea | [`business-brainstorm`](./skills/business-brainstorm/SKILL.md) |\n| Research a topic with citations | [`deep-research`](./skills/deep-research/SKILL.md) |\n| Find an available `.com` for a new project | [`domain`](./skills/domain/SKILL.md) |\n| Capture / query / lint my personal knowledge base | [`second-brain`](./skills/second-brain/SKILL.md) |\n| Same but for a team-shared knowledge base | [`company-brain`](./skills/company-brain/SKILL.md) |\n| Extract notes / highlights / summaries from a book | [`read-book`](./skills/read-book/SKILL.md) |\n| Extract a transcript or key moments from a video | [`watch-video`](./skills/watch-video/SKILL.md) |\n| Fetch any social post by URL as structured data | [`social-fetch`](./skills/social-fetch/SKILL.md) |\n| Plan / draft social content rotation across a portfolio | [`jab-hook`](./skills/jab-hook/SKILL.md) |\n| Draft, update, convert, or export a slide deck | [`slide-deck`](./skills/slide-deck/SKILL.md) |\n| Clean terminal output for Slack / LinkedIn / X / Notion etc. | [`paste`](./skills/paste/SKILL.md) |\n| Manage projects across businesses (kanban) | [`pm`](./skills/pm/SKILL.md) |\n| Model personal financial scenarios (house, cash flow, etc.) | [`personal-cfo`](./skills/personal-cfo/SKILL.md) |\n| Run monthly / weekly CFO for a company or agency | [`company-cfo`](./skills/company-cfo/SKILL.md) |\n| Create, adapt, or update a skill | [`skillify`](./skills/skillify/SKILL.md) |\n| Wire up an integration / API / MCP into a project | [`toolify`](./skills/toolify/SKILL.md) |\n| Set up an agent loop or scheduled task | [`loopify`](./skills/loopify/SKILL.md) |\n\nNot sure between two? The **skill's SKILL.md description** always includes trigger phrases and disambiguation from adjacent skills.\n\n## anvaka/spell-book/blob/main/README.md\n\n<https://github.com/anvaka/spell-book/blob/main/README.md>\n\n| Spell | Description |\n|-------|-------------|\n| [process-book](spells/process-book/) | Transform a book into a multi-lens interactive exploration |\n| [nominal-panel](spells/nominal-panel/) | Ideate with isolated, decorrelated agents; pool, rank, and explain the best ideas |\n\n## Problem solving\n\n- C:\\Users\\maksi\\repos\\pi-agent-config\\skills\\problem-solving\\inversion-exercise\n- C:\\Users\\maksi\\repos\\pi-agent-config\\skills\\problem-solving\\simplification-cascades\n\n", "notes/auto-updating-progress-card-pre-commit-hook": "# Auto-updating progress card via pre-commit hook\n\n**Problem:** a progress stat card (```html preview block) inside a markdown plan goes stale as tasks get checked off.\n**Solution:** a bash pre-commit hook that greps the checkbox counts and rewrites the card values *in the same commit* \u2014 numbers can never lie.\nReusable for any tracked markdown doc with `- [x]` / `- [ ]` checkboxes: plans, migration trackers, runbooks.\n\n## How it works\n\n1. Pre-commit fires \u2192 checks if the plan file is staged (skips otherwise, so unrelated commits stay clean).\n2. `grep` counts `- [x]` (done) and `- [ ]` (pending).\n3. `awk` excludes superseded items: pending checkboxes below a `- [x] ... below \u2014` marker line, up to the next `###` heading (pattern for \"old plan text kept for history\").\n4. `sed` rewrites the card's stat rows, matched by label (`'Total tasks'`, `'Completed'`, `'Remaining'`) \u2014 value + subtext fields.\n5. `git add` the file \u2192 fresh numbers land in the same commit.\n\n```mermaid\ngraph LR\n    A[git commit] --> B{plan staged?}\n    B -->|no| Z[exit 0]\n    B -->|yes| C[grep counts]\n    C --> D[awk: minus superseded]\n    D --> E[sed: rewrite card rows]\n    E --> F[git add plan]\n    F --> G[commit lands with fresh stats]\n```\n\n## Files\n\n**`scripts/update-plan-stats.sh` (committed):**\n\n```sh\n#!/bin/sh\n# Refresh the progress stat card in the plan before commit.\n# Runs on any platform with sh + grep + awk + sed (Git Bash on Windows).\nPLAN=\"plans/personal-wiki-setup-plan.md\"\n\n# Only touch the commit when the plan itself is staged (skip with --force for manual runs)\nif [ \"$1\" != \"--force\" ]; then\n  git diff --cached --name-only | grep -qx \"$PLAN\" || exit 0\nfi\n[ -f \"$PLAN\" ] || exit 0\n\ndone_n=$(grep -cE '^- \\[x\\]' \"$PLAN\" || true)\ntodo_raw=$(grep -cE '^- \\[ \\]' \"$PLAN\" || true)\n\n# Superseded = pending [ ] items below a \"- [x] ... below \u2014\" marker, until next ### heading\nsup=$(awk '/^### /{s=0} /^- \\[x\\].*below/{s=1;next} s&&/^- \\[ \\]/{n++} END{print n+0}' \"$PLAN\")\n\ntotal_raw=$((done_n + todo_raw))\ntodo=$((todo_raw - sup))\ntotal=$((total_raw - sup))\npct=$(( total > 0 ? done_n * 100 / total : 0 ))\n\nsed -i -E \\\n  -e \"s|^(      \\['Total tasks', ')[0-9]+(', ')[^']*(')|\\1$total\\2$total_raw raw - $sup superseded\\3|\" \\\n  -e \"s|^(      \\['Completed', ')[0-9]+(', ')[^']*(')|\\1$done_n\\2$pct% of plan\\3|\" \\\n  -e \"s|^(      \\['Remaining', ')[0-9]+(')|\\1$todo\\2|\" \\\n  \"$PLAN\"\n\ngit add \"$PLAN\"\n```\n\n**`.git/hooks/pre-commit` (local-only \u2014 hooks never travel with git):**\n\n```sh\n#!/bin/sh\nexec sh \"scripts/update-plan-stats.sh\"\n```\n\n## Install (one command)\n\n```bash\nchmod +x scripts/update-plan-stats.sh && \\\n{ echo '#!/bin/sh'; echo 'exec sh \"scripts/update-plan-stats.sh\"'; } > .git/hooks/pre-commit && \\\nchmod +x .git/hooks/pre-commit\n```\n\nRepeat after any fresh clone (hooks live outside version control). Alternative: `git config core.hooksPath scripts/` to point git at a committed hooks dir.\n\n## Reusing on another plan/tracker\n\n- Set `PLAN=` to the target file (repo-relative path).\n- The card rows must keep the exact labels `'Total tasks'`, `'Completed'`, `'Remaining'` (sed matches on them) \u2014 change labels \u2194 change the sed patterns.\n- The superseded rule is optional; delete the `sup=` line and the arithmetic if you want raw counts.\n- Manual refresh anytime: `sh scripts/update-plan-stats.sh --force` (bypasses the staged-check).\n\n## Verification gate (as applied 2026-07-30)\n\n- Manual `--force` run \u2192 card recomputed (171/29/142) \u2705\n- Idempotent second run \u2192 no diff \u2705\n- Guard: plan unstaged \u2192 skip; staged \u2192 run \u2705\n- Real commit fired the hook clean \u2705\n\n## Card template used in the plan\n\n```html preview\n<div style=\"font-family:system-ui,sans-serif;padding:20px\">\n  <div id=\"cards\" style=\"display:flex;gap:14px;flex-wrap:wrap\"><\/div>\n  <script>\n    var stats = [\n      ['Total tasks', '171', '180 raw - 9 superseded', 'var(--chart-2)'],\n      ['Completed', '29', '16% of plan', 'var(--chart-1)'],\n      ['Remaining', '142', 'next: 1.6 backup \u00b7 1.3-1.4 QMD', 'var(--chart-5)']\n    ];\n    document.getElementById('cards').innerHTML = stats.map(function (s) {\n      return '<div style=\"flex:1;min-width:150px;padding:16px;background:var(--card);' +\n        'color:var(--card-foreground);border:1px solid var(--border);' +\n        'border-radius:var(--radius)\">' +\n        '<div style=\"font-size:13px;color:var(--muted-foreground)\">' + s[0] + '<\/div>' +\n        '<div style=\"font-size:26px;font-weight:700;margin-top:4px\">' + s[1] + '<\/div>' +\n        '<div style=\"font-size:12px;font-weight:600;margin-top:4px;color:' + s[3] + '\">' +\n        s[2] + '<\/div>' +\n        '<\/div>';\n    }).join('');\n  <\/script>\n<\/div>\n```\n\nTheme tokens (`var(--card)`, `var(--chart-1)` \u2026) come from OK's preview iframe \u2014 card tracks light/dark theme automatically.\n\n## See also\n\n- [Personal Wiki Setup \u2014 Phased Plan](../plans/personal-wiki-setup-plan.md) \u2014 live consumer of this technique\n- [Verification-before-completion skill](file:///C:/Users/maksi/.pi/agent/skills/verification-before-completion/SKILL.md) \u2014 the gate discipline that caught \"stale static numbers\" in the first place", "notes/parents-relocation-index": "\n# Parents Retirement Relocation\n\n## Questions\n\n- Where\n- Why that location\n- What are important factors\n- When\n- How much\n- What are strategic alternatives\n\n## Useful skills\n\n- `C:\\Users\\maksi\\repos\\pi-agent-config\\skills\\brainstorming`\n- `grilling`\n- `nominal-panel`\n\n## Potential locations\n\n\n- Give me a list of 3-5 large-medium towns east of Moscow reutov, 2 hours by train (\u044d\u043b\u0435\u043a\u0442\u0440\u0438\u0447\u043a\u0430 , \u043d\u0435 \u043f\u043e\u0435\u0437\u0434). Friendly for my retired parents. Ask me if you need more info. \n- \u041f\u0440\u044f\u043c\u0430\u044f \u044d\u043b\u0435\u043a\u0442\u0440\u0438\u0447\u043a\u0430 \u0438 \u043d\u0430\u0438\u0431\u043e\u043b\u0435\u0435 \u043b\u0435\u0433\u043a\u0438\u0439 \u0441\u043f\u043e\u0441\u043e\u0431 \u0434\u043e\u0431\u0440\u0430\u0442\u044c\u0441\u044f \u0434\u043e \u0420\u0435\u0443\u0442\u043e\u0432. \u041f\u0440\u0438\u0440\u043e\u0434\u0430, \u043e\u0445\u043e\u0442\u0430, \u0440\u0430\u0431\u0430\u0442\u043a\u0430, \u043c\u0435\u0434\u0438\u0446\u0438\u043d\u0430, \u0438\u043d\u0444\u0440\u0430\u0441\u0442\u0440\u0443\u043a\u0442\u0443\u0440\u0430\n- \u041f\u0440\u0435\u0434\u043b\u043e\u0436\u0438 \u0435\u0449\u0451 \u0432\u0430\u0440\u0438\u0430\u043d\u0442\u044b \u0432 \u043f\u0440\u0435\u0434\u0435\u043b\u0430\u0445 2 \u0447\u0430\u0441\u043e\u0432, \u043f\u0440\u044f\u043c\u0430 \u044d\u043b\u0435\u043a\u0442\u0440\u0438\u0447\u043a\u0430, \u043d\u0430 \u0432\u043e\u0441\u0442\u043e\u043a \u043e\u0442 \u0420\u0435\u0443\u0442\u043e\u0432. \u041f\u043b\u044e\u0441\u044b, \u043c\u0438\u043d\u0443\u0441\u044b \u0434\u043b\u044f \u043a\u0430\u0436\u0434\u043e\u0433\u043e\n- \u041f\u0440\u043e\u0432\u0435\u0440\u044c \u043d\u0430 \u043a\u0430\u043a\u043e\u043c \u0440\u0430\u0441\u0441\u0442\u043e\u044f\u043d\u0438\u0438 \u043d\u0430\u0445\u043e\u0434\u0438\u0442\u0441\u044f \u0431\u043b\u0438\u0436\u0430\u0439\u0448\u0438\u0439 \u043a\u0440\u0443\u043f\u043d\u044b\u0439 \u0437\u0430\u0432\u043e\u0434 \u0438\u043b\u0438 \u0432\u0440\u0435\u0434\u043d\u043e\u0435 \u043f\u0440\u043e\u0438\u0437\u0432\u043e\u0434\u0441\u0442\u0432\u043e, \u0431\u043e\u043b\u044c\u0448\u0430\u044f \u0441\u0432\u0430\u043b\u043a\u0430, \u0434\u0440\u0443\u0433\u0438\u0435 \u043e\u0431\u044a\u0435\u043a\u0442\u044b \u0438\u043d\u0444\u0440\u0430\u0441\u0442\u0440\u0443\u043a\u0442\u0443\u0440\u044b \u043a\u043e\u0442\u043e\u0440\u044b\u0435 \u043d\u0435\u0433\u0430\u0442\u0438\u0432\u043d\u043e \u0432\u043b\u0438\u044f\u044e\u0442 \u043d\u0430 \u0440\u0435\u0437\u0438\u0434\u0435\u043d\u0442\u043e\u0432, \u044d\u043a\u043e\u043b\u043e\u0433\u0438\u044e\u0438\u043d\u0444\u0440\u0430\u0441\u0442\u0440\u043e\u044c\u0435\u043a\u0442\u043f\u0440\u043e\u0438 \n\n\n---\nAnswer: \n\n\u0412\u043e\u0442 4 \u043b\u0443\u0447\u0448\u0438\u0445 \u0432\u0430\u0440\u0438\u0430\u043d\u0442\u0430 \u0433\u043e\u0440\u043e\u0434\u043e\u0432 \u0432\u043e\u0441\u0442\u043e\u0447\u043d\u0435\u0435 \u0420\u0435\u0443\u0442\u043e\u0432\u0430, \u043a\u0443\u0434\u0430 \u0445\u043e\u0434\u044f\u0442 \u043f\u0440\u044f\u043c\u044b\u0435 \u043e\u0431\u044b\u0447\u043d\u044b\u0435 \u044d\u043b\u0435\u043a\u0442\u0440\u0438\u0447\u043a\u0438 \u0441 \u041c\u0426\u0414-4/\u0413\u043e\u0440\u044c\u043a\u043e\u0432\u0441\u043a\u043e\u0433\u043e \u043d\u0430\u043f\u0440\u0430\u0432\u043b\u0435\u043d\u0438\u044f \u0431\u0435\u0437 \u043f\u0435\u0440\u0435\u0441\u0430\u0434\u043e\u043a \u0438 \u0432\u0440\u0435\u043c\u044f \u0432 \u043f\u0443\u0442\u0438 \u0441\u043e\u0441\u0442\u0430\u0432\u043b\u044f\u0435\u0442 \u0434\u043e 2 \u0447\u0430\u0441\u043e\u0432.\n\n1. \u041f\u0430\u0432\u043b\u043e\u0432\u0441\u043a\u0438\u0439 \u041f\u043e\u0441\u0430\u0434\n\u0412\u0440\u0435\u043c\u044f \u0432 \u043f\u0443\u0442\u0438 \u043e\u0442 \u0420\u0435\u0443\u0442\u043e\u0432\u043e: ~1 \u0447\u0430\u0441 10 \u043c\u0438\u043d\u0443\u0442 \u2013 1 \u0447\u0430\u0441 20 \u043c\u0438\u043d\u0443\u0442 (\u043f\u0440\u044f\u043c\u0430\u044f \u044d\u043b\u0435\u043a\u0442\u0440\u0438\u0447\u043a\u0430 \u043d\u0430 \u041f\u0435\u0442\u0443\u0448\u043a\u0438/\u0412\u043b\u0430\u0434\u0438\u043c\u0438\u0440).\n\n- \u041f\u043b\u044e\u0441\u044b:\n  - \u041a\u043e\u043c\u0444\u043e\u0440\u0442\u043d\u044b\u0439 \u043b\u0430\u043d\u0434\u0448\u0430\u0444\u0442: \u041e\u0447\u0435\u043d\u044c \u043a\u043e\u043c\u043f\u0430\u043a\u0442\u043d\u044b\u0439, \u0440\u043e\u0432\u043d\u044b\u0439 \u0438 \u0437\u0435\u043b\u0451\u043d\u044b\u0439 \u0433\u043e\u0440\u043e\u0434 \u0441 \u0442\u0438\u0445\u0438\u043c \u0438\u0441\u0442\u043e\u0440\u0438\u0447\u0435\u0441\u043a\u0438\u043c \u0446\u0435\u043d\u0442\u0440\u043e\u043c. \u0423\u0434\u043e\u0431\u043d\u043e \u0445\u043e\u0434\u0438\u0442\u044c \u043f\u0435\u0448\u043a\u043e\u043c \u0431\u0435\u0437 \u043f\u043e\u0434\u044a\u0451\u043c\u043e\u0432 \u0438 \u0441\u043f\u0443\u0441\u043a\u043e\u0432.\n  - \u041f\u0440\u0438\u0440\u043e\u0434\u0430 \u0438 \u0434\u043e\u0441\u0443\u0433: \u0412 \u0447\u0435\u0440\u0442\u0435 \u0433\u043e\u0440\u043e\u0434\u0430 \u043f\u0440\u043e\u0442\u0435\u043a\u0430\u044e\u0442 \u0440\u0435\u043a\u0438 \u041a\u043b\u044f\u0437\u044c\u043c\u0430 \u0438 \u0412\u043e\u0445\u043d\u0430. \u0412 \u043e\u043a\u0440\u0435\u0441\u0442\u043d\u043e\u0441\u0442\u044f\u0445 \u043c\u043d\u043e\u0433\u043e \u043b\u0435\u0441\u043e\u0432, \u043c\u0430\u043b\u044b\u0445 \u043e\u0437\u0451\u0440 \u0438 \u0447\u0430\u0441\u0442\u043d\u044b\u0445 \u043f\u0440\u0443\u0434\u043e\u0432 \u0434\u043b\u044f \u0441\u043f\u043e\u043a\u043e\u0439\u043d\u043e\u0439 \u0440\u044b\u0431\u0430\u043b\u043a\u0438.\n  - \u0418\u043d\u0444\u0440\u0430\u0441\u0442\u0440\u0443\u043a\u0442\u0443\u0440\u0430: \u0415\u0441\u0442\u044c \u0440\u0430\u0439\u043e\u043d\u043d\u0430\u044f \u0431\u043e\u043b\u044c\u043d\u0438\u0446\u0430, \u043f\u043e\u043b\u0438\u043a\u043b\u0438\u043d\u0438\u043a\u0438, \u0446\u0435\u043d\u0442\u0440\u0430\u043b\u044c\u043d\u044b\u0439 \u0440\u044b\u043d\u043e\u043a \u0438 \u0432\u0441\u0435 \u0441\u0435\u0442\u0435\u0432\u044b\u0435 \u043c\u0430\u0433\u0430\u0437\u0438\u043d\u044b.\n- \u041c\u0438\u043d\u0443\u0441\u044b:\n  - \u0414\u043b\u044f \u0441\u043b\u043e\u0436\u043d\u043e\u0439 \u043c\u0435\u0434\u0438\u0446\u0438\u043d\u0441\u043a\u043e\u0439 \u043f\u043e\u043c\u043e\u0449\u0438 \u0438\u043b\u0438 \u0443\u0437\u043a\u0438\u0445 \u0441\u043f\u0435\u0446\u0438\u0430\u043b\u0438\u0441\u0442\u043e\u0432 \u0447\u0430\u0449\u0435 \u043f\u0440\u0438\u0445\u043e\u0434\u0438\u0442\u0441\u044f \u0435\u0437\u0434\u0438\u0442\u044c \u0432 \u0441\u043e\u0441\u0435\u0434\u043d\u0435\u0435 \u041e\u0440\u0435\u0445\u043e\u0432\u043e-\u0417\u0443\u0435\u0432\u043e \u0438\u043b\u0438 \u041d\u043e\u0433\u0438\u043d\u0441\u043a.\n\n2. \u041d\u043e\u0433\u0438\u043d\u0441\u043a\n\u0412\u0440\u0435\u043c\u044f \u0432 \u043f\u0443\u0442\u0438 \u043e\u0442 \u0420\u0435\u0443\u0442\u043e\u0432\u043e: ~1 \u0447\u0430\u0441 20 \u043c\u0438\u043d\u0443\u0442 \u2013 1 \u0447\u0430\u0441 30 \u043c\u0438\u043d\u0443\u0442 (\u043f\u0440\u044f\u043c\u0430\u044f \u0432\u0435\u0442\u043a\u0430 \u043d\u0430 \u0417\u0430\u0445\u0430\u0440\u043e\u0432\u043e).\n\n- \u041f\u043b\u044e\u0441\u044b:\n  - \u0420\u0430\u0437\u0432\u0438\u0442\u0430\u044f \u0433\u043e\u0440\u043e\u0434\u0441\u043a\u0430\u044f \u0441\u0440\u0435\u0434\u0430: \u041a\u0440\u0443\u043f\u043d\u044b\u0439 \u0446\u0435\u043d\u0442\u0440 \u0441 \u0445\u043e\u0440\u043e\u0448\u0435\u0439 \u0431\u043e\u043b\u044c\u043d\u0438\u0447\u043d\u043e\u0439 \u0431\u0430\u0437\u043e\u0439 (\u0426\u0420\u0411, \u043c\u043d\u043e\u0433\u043e\u043f\u0440\u043e\u0444\u0438\u043b\u044c\u043d\u044b\u0435 \u0446\u0435\u043d\u0442\u0440\u044b), \u0443\u0434\u043e\u0431\u043d\u044b\u043c \u0432\u043d\u0443\u0442\u0440\u0438\u0433\u043e\u0440\u043e\u0434\u0441\u043a\u0438\u043c \u0442\u0440\u0430\u043d\u0441\u043f\u043e\u0440\u0442\u043e\u043c \u0438 \u0431\u043b\u0430\u0433\u043e\u0443\u0441\u0442\u0440\u043e\u0435\u043d\u043d\u044b\u043c\u0438 \u043f\u0430\u0440\u043a\u0430\u043c\u0438 (\u041f\u0430\u0440\u043a \u0412\u043e\u043b\u0445\u043e\u043d\u043a\u0430, \u0413\u043b\u0443\u0445\u043e\u0432\u0441\u043a\u0438\u0439 \u043f\u0430\u0440\u043a).\n  - \u0420\u044b\u0431\u0430\u043b\u043a\u0430 \u0438 \u043e\u0442\u0434\u044b\u0445: \u0420\u0435\u043a\u0430 \u041a\u043b\u044f\u0437\u044c\u043c\u0430, \u0427\u0435\u0440\u043d\u043e\u0433\u043e\u043b\u043e\u0432\u0441\u043a\u0438\u0439 \u043f\u0440\u0443\u0434 \u0438 \u0431\u043b\u0438\u0437\u043b\u0435\u0436\u0430\u0449\u0438\u0435 \u043b\u0435\u0441\u0430 \u0441 \u043e\u0445\u043e\u0442\u043d\u0438\u0447\u044c\u0438\u043c\u0438 \u0443\u0433\u043e\u0434\u044c\u044f\u043c\u0438.\n- \u041c\u0438\u043d\u0443\u0441\u044b:\n  - \u0413\u043e\u0440\u043e\u0434 \u0434\u043e\u0441\u0442\u0430\u0442\u043e\u0447\u043d\u043e \u043e\u0436\u0438\u0432\u043b\u0451\u043d\u043d\u044b\u0439 \u0438 \u0430\u0432\u0442\u043e\u043c\u043e\u0431\u0438\u043b\u044c\u043d\u044b\u0439, \u0432 \u0446\u0435\u043d\u0442\u0440\u0435 \u043c\u043e\u0436\u0435\u0442 \u0431\u044b\u0442\u044c \u0448\u0443\u043c\u043d\u043e \u043f\u043e \u0441\u0440\u0430\u0432\u043d\u0435\u043d\u0438\u044e \u0441 \u043c\u0430\u043b\u044b\u043c\u0438 \u0433\u043e\u0440\u043e\u0434\u043a\u0430\u043c\u0438.\n\n3. \u041f\u043e\u043a\u0440\u043e\u0432 (\u0412\u043b\u0430\u0434\u0438\u043c\u0438\u0440\u0441\u043a\u0430\u044f \u043e\u0431\u043b\u0430\u0441\u0442\u044c)\n\u0412\u0440\u0435\u043c\u044f \u0432 \u043f\u0443\u0442\u0438 \u043e\u0442 \u0420\u0435\u0443\u0442\u043e\u0432\u043e: ~1 \u0447\u0430\u0441 30 \u043c\u0438\u043d\u0443\u0442 \u2013 1 \u0447\u0430\u0441 45 \u043c\u0438\u043d\u0443\u0442.\n\n- \u041f\u043b\u044e\u0441\u044b:\n  - \u041e\u0442\u043b\u0438\u0447\u043d\u0430\u044f \u043f\u0440\u0438\u0440\u043e\u0434\u0430: \u0413\u043e\u0440\u043e\u0434 \u0440\u0430\u0441\u043f\u043e\u043b\u043e\u0436\u0435\u043d \u043f\u0440\u044f\u043c\u043e \u043d\u0430 \u0432\u044a\u0435\u0437\u0434\u0435 \u0432 \u041c\u0435\u0449\u0451\u0440\u0443 \u2014 \u043a\u0440\u0443\u0433\u043e\u043c \u0441\u043e\u0441\u043d\u043e\u0432\u044b\u0435 \u0431\u043e\u0440\u044b, \u0431\u043e\u0433\u0430\u0442\u044b\u0435 \u044f\u0433\u043e\u0434\u0430\u043c\u0438 \u0438 \u0433\u0440\u0438\u0431\u0430\u043c\u0438, \u043e\u0437\u0451\u0440\u0430 (\u0412\u0432\u0435\u0434\u0435\u043d\u0441\u043a\u043e\u0435 \u043e\u0437\u0435\u0440\u043e) \u0438 \u0440\u0435\u043a\u0438.\n  - \u041e\u0445\u043e\u0442\u0430 \u0438 \u0440\u044b\u0431\u0430\u043b\u043a\u0430: \u041e\u0434\u043d\u043e \u0438\u0437 \u043b\u0443\u0447\u0448\u0438\u0445 \u043c\u0435\u0441\u0442 \u0434\u043b\u044f \u043e\u0445\u043e\u0442\u043d\u0438\u043a\u043e\u0432 \u0438 \u0440\u044b\u0431\u043e\u043b\u043e\u0432\u043e\u0432 (\u043b\u0435\u0441\u043d\u044b\u0435 \u0432\u043e\u0434\u043e\u0451\u043c\u044b, \u0434\u0438\u0447\u044c, \u0433\u043b\u0443\u0445\u0438\u0435 \u043c\u0435\u0441\u0442\u0430 \u0432\u0441\u0435\u0433\u043e \u0432 15\u201320 \u043c\u0438\u043d\u0443\u0442\u0430\u0445 \u043e\u0442 \u0433\u043e\u0440\u043e\u0434\u0430).\n  - \u0422\u0438\u0448\u0438\u043d\u0430: \u0421\u043f\u043e\u043a\u043e\u0439\u043d\u044b\u0439, \u043d\u0435\u0432\u044b\u0441\u043e\u043a\u0438\u0439 \u0433\u043e\u0440\u043e\u0434 \u0431\u0435\u0437 \u0441\u0442\u043e\u043b\u0438\u0447\u043d\u043e\u0439 \u0441\u0443\u0435\u0442\u044b.\n- \u041c\u0438\u043d\u0443\u0441\u044b:\n  - \u041c\u0435\u0434\u0438\u0446\u0438\u043d\u0430: \u041f\u0435\u0440\u0435\u0445\u043e\u0434 \u0438\u0437 \u041c\u043e\u0441\u043a\u043e\u0432\u0441\u043a\u043e\u0439 \u043e\u0431\u043b\u0430\u0441\u0442\u0438 \u0432\u043e \u0412\u043b\u0430\u0434\u0438\u043c\u0438\u0440\u0441\u043a\u0443\u044e \u043e\u0437\u043d\u0430\u0447\u0430\u0435\u0442 \u0441\u043c\u0435\u043d\u0443 \u0440\u0435\u0433\u0438\u043e\u043d\u0430\u043b\u044c\u043d\u043e\u0439 \u0441\u0438\u0441\u0442\u0435\u043c\u044b \u0437\u0434\u0440\u0430\u0432\u043e\u043e\u0445\u0440\u0430\u043d\u0435\u043d\u0438\u044f (\u0432 \u0441\u043b\u043e\u0436\u043d\u044b\u0445 \u0441\u043b\u0443\u0447\u0430\u044f\u0445 \u043f\u0440\u0438\u0434\u0435\u0442\u0441\u044f \u043e\u0431\u0440\u0430\u0449\u0430\u0442\u044c\u0441\u044f \u0432\u043e \u0412\u043b\u0430\u0434\u0438\u043c\u0438\u0440 \u0438\u043b\u0438 \u0438\u0441\u043a\u0430\u0442\u044c \u0447\u0430\u0441\u0442\u043d\u044b\u0435 \u043a\u043b\u0438\u043d\u0438\u043a\u0438).\n  - \u0423\u0434\u0430\u043b\u0451\u043d\u043d\u043e\u0441\u0442\u044c \u0436/\u0434 \u0441\u0442\u0430\u043d\u0446\u0438\u0438: \u0421\u0442\u0430\u043d\u0446\u0438\u044f \u041f\u043e\u043a\u0440\u043e\u0432 \u043d\u0430\u0445\u043e\u0434\u0438\u0442\u0441\u044f \u0432 3\u20134 \u043a\u043c \u043e\u0442 \u0441\u0430\u043c\u043e\u0433\u043e \u0433\u043e\u0440\u043e\u0434\u0430 (\u043d\u0443\u0436\u043d\u043e \u043f\u0440\u043e\u0435\u0445\u0430\u0442\u044c 10 \u043c\u0438\u043d\u0443\u0442 \u043d\u0430 \u043c\u0435\u0441\u0442\u043d\u043e\u043c \u0430\u0432\u0442\u043e\u0431\u0443\u0441\u0435 \u0438\u043b\u0438 \u0442\u0430\u043a\u0441\u0438).\n\n4. \u042d\u043b\u0435\u043a\u0442\u0440\u043e\u0433\u043e\u0440\u0441\u043a\n\u0412\u0440\u0435\u043c\u044f \u0432 \u043f\u0443\u0442\u0438 \u043e\u0442 \u0420\u0435\u0443\u0442\u043e\u0432\u043e: ~1 \u0447\u0430\u0441 20 \u043c\u0438\u043d\u0443\u0442 \u2013 1 \u0447\u0430\u0441 30 \u043c\u0438\u043d\u0443\u0442 (\u043f\u0440\u044f\u043c\u0430\u044f \u0442\u0443\u043f\u0438\u043a\u043e\u0432\u0430\u044f \u0432\u0435\u0442\u043a\u0430).\n\n- \u041f\u043b\u044e\u0441\u044b:\n  - \u0412\u043e\u0434\u043d\u044b\u0439 \u043a\u0440\u0430\u0439: \u0413\u043e\u0440\u043e\u0434 \u0431\u0443\u043a\u0432\u0430\u043b\u044c\u043d\u043e \u043e\u043a\u0440\u0443\u0436\u0451\u043d \u043e\u0437\u0451\u0440\u0430\u043c\u0438, \u043a\u0430\u0440\u044c\u0435\u0440\u0430\u043c\u0438 \u0438 \u0442\u043e\u0440\u0444\u044f\u043d\u044b\u043c\u0438 \u043f\u0440\u0443\u0434\u0430\u043c\u0438 (\u043e\u0437. \u0421\u0442\u0430\u043d\u0438\u0447\u043d\u043e\u0435, \u043e\u0437\u0435\u0440\u043d\u0430\u044f \u0441\u0438\u0441\u0442\u0435\u043c\u0430 \u041c\u0435\u0449\u0451\u0440\u044b) \u2014 \u0438\u0434\u0435\u0430\u043b\u044c\u043d\u044b\u0435 \u043c\u0435\u0441\u0442\u0430 \u0434\u043b\u044f \u0440\u044b\u0431\u0430\u043b\u043a\u0438 \u0431\u0443\u043a\u0432\u0430\u043b\u044c\u043d\u043e \u0437\u0430 \u043f\u043e\u0440\u043e\u0433\u043e\u043c.\n  - \u041a\u043e\u043c\u043f\u0430\u043a\u0442\u043d\u043e\u0441\u0442\u044c: \u0422\u0438\u0445\u0438\u0439, \u0442\u0443\u043f\u0438\u043a\u043e\u0432\u044b\u0439 \u0433\u043e\u0440\u043e\u0434 (\u043d\u0435\u0442 \u0442\u0440\u0430\u043d\u0437\u0438\u0442\u043d\u043e\u0433\u043e \u0442\u0440\u0430\u0444\u0438\u043a\u0430), \u043e\u0447\u0435\u043d\u044c \u043c\u043d\u043e\u0433\u043e \u0437\u0435\u043b\u0435\u043d\u0438 \u043f\u0440\u044f\u043c\u043e \u0432\u043e \u0434\u0432\u043e\u0440\u0430\u0445.\n- \u041c\u0438\u043d\u0443\u0441\u044b:\n  - \u0411\u0430\u0437\u043e\u0432\u0430\u044f \u043c\u0435\u0434\u0438\u0446\u0438\u043d\u0430 \u043d\u0430 \u043c\u0435\u0441\u0442\u0435 \u0435\u0441\u0442\u044c (\u0433\u043e\u0440\u043e\u0434\u0441\u043a\u0430\u044f \u0431\u043e\u043b\u044c\u043d\u0438\u0446\u0430), \u043d\u043e \u0437\u0430 \u0443\u0437\u043a\u0438\u043c\u0438 \u0441\u043f\u0435\u0446\u0438\u0430\u043b\u0438\u0441\u0442\u0430\u043c\u0438 \u043f\u0440\u0438\u0434\u0451\u0442\u0441\u044f \u0435\u0437\u0434\u0438\u0442\u044c \u0432 \u0441\u043e\u0441\u0435\u0434\u043d\u0438\u0439 \u041f\u0430\u0432\u043b\u043e\u0432\u0441\u043a\u0438\u0439 \u041f\u043e\u0441\u0430\u0434 \u0438\u043b\u0438 \u041e\u0440\u0435\u0445\u043e\u0432\u043e-\u0417\u0443\u0435\u0432\u043e.\n  - \u041c\u0435\u043d\u044c\u0448\u0435 \u0432\u0430\u0440\u0438\u0430\u043d\u0442\u043e\u0432 \u0434\u043e\u0441\u0443\u0433\u0430 \u043f\u043e\u043c\u0438\u043c\u043e \u043f\u0440\u0438\u0440\u043e\u0434\u044b.\n", "notes/pi-acp-ollama-connection-error": "# Pi ACP chat fails until Ollama is running\n\n## Symptom\nIn the OpenKnowledge web app, **New Pi ACP chat** loads skills/extensions and reports `MCP: 2 servers connected (42 tools)`, but every reply is empty followed by `Retrying (attempt 1/3, waiting 2s)\u2026` three times, then `Retry finished, resuming.` No model output. Interactive `pi` in the same project works fine.\n\n## Root cause\nThe ACP chat runs Pi through a third-party adapter, `pi-acp` (OK launches `npx pi-acp@0.0.32`), which spawns `pi --mode rpc --no-themes`. Pi loads the `ollama` provider (`glm-5.2:cloud`) but the HTTP call to `http://127.0.0.1:11434/v1` fails with **`Connection error.`** and zero tokens \u2014 the local Ollama daemon wasn't running when ACP started. Pi retries 3\u00d7 and gives up; `pi-acp` forwards the retry lines as chat text.\n\nConfirmed in Pi's session log: `~/.pi/agent/sessions/<project>/<ts>_<id>.jsonl` shows each assistant turn as `\"content\":[],\"stopReason\":\"error\",\"errorMessage\":\"Connection error.\",\"usage\":{\"totalTokens\":0}`.\n\n## Fix that worked\n1. In a terminal **inside the project folder**, start a regular `pi` session (this guarantees Ollama is up and the cloud model is warm).\n2. Open / focus the OpenKnowledge web app.\n3. Click **New Pi ACP chat**.\n4. Pi replies successfully.\n\n## Why it works\nCloud models (`glm-5.2:cloud`) are proxied through the **local Ollama daemon** \u2014 the daemon must be running for both local and cloud requests. The interactive `pi` session forces Ollama up before ACP launches, so the `pi-acp` subprocess finds a live `127.0.0.1:11434`.\n\n## Pre-flight check (any time ACP acts up)\n```bash\ncurl -s -m 5 http://127.0.0.1:11434/api/tags -o /dev/null -w \"HTTP %{http_code}\\n\"\n```\n`HTTP 200` = Ollama up. Otherwise start it (`ollama serve` or launch the Ollama app) and retry. Set Ollama to **Run on startup** so the daemon is always available.\n\n## Researched insights\n- **`pi-acp` is not Pi's native ACP mode** \u2014 it's a community adapter (`svkozak/pi-acp`, `0.0.x`) bridging Pi's NDJSON RPC protocol to ACP. Early version; if streaming/tool-output oddness appears later, look here first.\n- **Pi \u2194 Ollama uses the OpenAI-compat shim** (`api: openai-completions`, `baseUrl: \u2026/v1`) configured by `ollama launch pi` in `~/.pi/agent/models.json`. Streaming emits reasoning in a `reasoning` field (not OpenAI's `reasoning_content`) \u2014 benign here, but a known interop seam.\n- **`glm-5.2` thinking levels:** the `pi-ollama-cloud` map exposes only `off`, `high`, `xhigh` (no `medium`). ACP defaults thinking to `medium`; it worked once connected, but if a model 400s on `reasoning_effort`, switch the ACP **Thinking** selector to `off`.\n- **Diagnose via** `~/.pi/agent/sessions/` (Pi-side) and `.ok/local/threads/` (OK-side ACP log).", "plans/personal-wiki-setup-plan": "# Personal Wiki Setup \u2014 Phased Plan\n\n> 8-week plan for a complete system: OpenKnowledge (central wiki repo) + QMD (search) + Pi agent (AI tasks) + Vercel/GH Pages (publishing). Relaxed pace, 2-4 hrs/week. Each task is 15-60 min.\n\n---\n\n\n\n```html preview\n<div style=\"font-family:system-ui,sans-serif;padding:20px\">\n  <div id=\"cards\" style=\"display:flex;gap:14px;flex-wrap:wrap\"><\/div>\n  <script>\n    var stats = [\n      ['Total tasks', '171', '180 raw - 9 superseded', 'var(--chart-2)'],\n      ['Completed', '29', '16% of plan', 'var(--chart-1)'],\n      ['Remaining', '142', 'next: 1.6 backup \u00b7 1.3-1.4 QMD', 'var(--chart-5)']\n    ];\n    document.getElementById('cards').innerHTML = stats.map(function (s) {\n      return '<div style=\"flex:1;min-width:150px;padding:16px;background:var(--card);' +\n        'color:var(--card-foreground);border:1px solid var(--border);' +\n        'border-radius:var(--radius)\">' +\n        '<div style=\"font-size:13px;color:var(--muted-foreground)\">' + s[0] + '<\/div>' +\n        '<div style=\"font-size:26px;font-weight:700;margin-top:4px\">' + s[1] + '<\/div>' +\n        '<div style=\"font-size:12px;font-weight:600;margin-top:4px;color:' + s[3] + '\">' +\n        s[2] + '<\/div>' +\n        '<\/div>';\n    }).join('');\n  <\/script>\n<\/div>\n```\n\n## Architecture Overview\n\nThe system separates **notes** (the source of truth) from **publishing** (how notes reach the web). One central wiki repo feeds multiple static-site consumers.\n\n```mermaid\ngraph LR\n    subgraph Source of Truth\n        Wiki[\"wiki repo<br/>OKF markdown\"]\n    end\n    subgraph Consumers\n        DG[\"my-digital-garden<br/>11ty + Vercel\"]\n        Quartz[\"Quartz<br/>(future)\"]\n        Astro[\"Astro<br/>(future)\"]\n    end\n    Wiki -->|\"copy script\"| DG\n    Wiki -.-|future| Quartz\n    Wiki -.-|future| Astro\n```\n\n| Repo | Path | Role |\n|------|------|------|\n| **wiki** | `C:\\Users\\maksi\\repos\\wiki` | Central notes \u2014 source of truth (OKF-conformant) |\n| **my-digital-garden** | `C:\\Users\\maksi\\repos\\my-digital-garden` | Publishing consumer (current) \u2014 11ty + Vercel |\n| (future) | \u2014 | Publishing consumer \u2014 Quartz or Astro |\n\nSee [wiki-architecture](../concepts/wiki-architecture.md) for the full concept doc.\n\n---\n\n## Current State\n\n- **iCloud Obsidian vault**: 1,686 .md files, git repo, many Obsidian plugins\n- **wiki repo**: `C:\\Users\\maksi\\repos\\wiki` \u2014 central notes repo, OKF-conformant (scaffolded with OKF starter pack: `concepts/`, `references/`, `notes/`, `external-sources/`, `research/`, `articles/`), managed by OpenKnowledge\n- **my-digital-garden repo**: `https://github.com/MaksimZinovev/my-digital-garden.git` \u2014 11ty-based publishing consumer, deployed to Vercel at `https://my-digital-garden-rouge.vercel.app/`\n- **OpenKnowledge**: Already installed (desktop app), managing the wiki repo\n- **Pi agent**: This AI coding agent (file ops, bash, MCP, web search)\n- **Obsidian plugins installed**: linter, auto-link-title, auto-note-mover, dataview, metadata-menu, templater, brat (beta plugin installer)\n\n## Target State\n\n- OpenKnowledge manages the **wiki repo** as the central source of truth (OKF-conformant)\n- QMD indexes the entire iCloud vault for local search (1,686 files)\n- Pi agent helps with migration, enrichment, lint, auto-tag/link\n- Notes published via **my-digital-garden** (11ty + Vercel) \u2014 copy script syncs wiki \u2192 garden at build time\n- Future: additional consumers (Quartz, Astro) can read from the same wiki repo without changing notes\n- `\"dg-publish\": true` in JSON frontmatter controls public/private split (Digital Garden plugin convention)\n- Automations: daily maintenance (Task Scheduler), weekly lint (Pi session)\n- Published site has: search, graph view, tags, categories, backlinks\n\n## Key Decisions\n\n- **Central repo**: `wiki` repo (`C:\\Users\\maksi\\repos\\wiki`) is the source of truth \u2014 OKF-conformant, managed by OpenKnowledge\n- **Publishing consumer**: `my-digital-garden` repo \u2014 11ty + Vercel, reads from wiki via build-time copy script\n- **Publishing**: Keep existing Vercel site working from day 1; evaluate Quartz/Astro later (notes unchanged)\n- **Sync mechanism**: Copy script (build-time) \u2014 filters by `dg-publish: true`, copies wiki notes \u2192 my-digital-garden/src/site/notes/\n- **Public/private**: `\"dg-publish\": true` in JSON frontmatter (existing Digital Garden convention \u2014 NOT `publish: true` in YAML)\n- **Frontmatter format**: Wiki repo uses YAML (OKF convention); publishing consumer uses JSON (Digital Garden plugin convention). Copy script converts as needed.\n- **QMD scope**: Index entire iCloud vault (all 1,686 files)\n- **AI agent**: Pi (not Claude Code)\n\n## Repo Audit (Task 1.1 \u2014 completed)\n\n- **112 notes** in `src/site/notes/` across 15 topic folders (git, playwright, cypress, javascript, etc.)\n- All notes use JSON frontmatter with `\"dg-publish\":true`, `permalink`, `tags`\n- Images stored in `src/site/img/user/{topic}/attachments/`\n- 11ty (Eleventy) static site, deployed to Vercel\n- Last commit: Jan 6, 2024 \u2014 1,002 total commits\n- Notes use Obsidian-style wikilinks (`[[path/note|display]]`) \u2014 11ty template converts to HTML\n\n---\n\n## Phase 1: Foundation \u2014 Repos & Tools (Week 1)\n\n> Goal: Clone the garden repo, configure OpenKnowledge, install QMD, verify Vercel site works.\n\n### 1.1 Clone my-digital-garden repo \u2705 DONE\n\n- [x] Clone `https://github.com/MaksimZinovev/my-digital-garden.git` to `C:\\Users\\maksi\\repos\\my-digital-garden`\n- [x] Verify the repo structure \u2014 found `src/site/notes/` (112 notes), `.eleventy.js`, `vercel.json`, `src/helpers/`, `src/site/`\n- [x] Check which notes are already published \u2014 all 112 notes have `\"dg-publish\":true` in JSON frontmatter (Digital Garden plugin convention, NOT `publish: true`)\n- [x] Run `git log --oneline -20` \u2014 1,002 commits, last commit Jan 6 2024\n\n### 1.2 Verify Vercel site works \u2705 DONE\n\n- [x] Visited `https://my-digital-garden-rouge.vercel.app/` \u2014 home, git MOC, note pages all render (graph, backlinks, images work)\n- [x] Checked visible notes \u2014 home shows 4 MOCs (cypress, playwright, git, javascript); git MOC lists all git notes + connected pages\n- [x] Test publish round-trip \u2014 pushed test edit \u2192 build FAILED (root cause: Node.js 18.x discontinued on Vercel) \u2192 fixed via [PR #24](https://github.com/MaksimZinovev/my-digital-garden/pull/24) (`engines: node >=22` + reverted test edits) \u2192 merged \u2192 Vercel build green (29s) \u2192 live site serves updated note. Verified locally first: `npm install` + `npm run build` exit 0 on Node v24.15.0 (117 files / 133 assets).\n- Note: `npm install` reports 51 vulnerabilities (8 critical) in 2023-era deps \u2014 not blocking; separate dependency-refresh pass if desired.\n\n### 1.3 Install QMD (30 min)\n\n- [ ] Install Node.js 22+ if not already installed (`node --version`)\n- [ ] Run `npm install -g @tobilu/qmd`\n- [ ] Verify: `qmd --version`\n- [ ] Run `qmd doctor` to check system requirements\n\n### 1.4 Index the iCloud vault with QMD (30 min)\n\n- [ ] Add collection: `qmd collection add \"C:\\Users\\maksi\\iCloudDrive\\iCloud~md~obsidian\\obsidian-sync\" --name vault`\n- [ ] Add context: `qmd context add qmd://vault \"My full Obsidian knowledge base \u2014 all notes, private and public\"`\n- [ ] Index: `qmd update`\n- [ ] Embed: `qmd embed` (this downloads \\~2GB of local models on first run, takes 10-20 min)\n- [ ] Test search: `qmd query \"karpathy wiki knowledge management\"`\n- [ ] Test search: `qmd search \"open brain\"`\n- [ ] Record stats: `qmd status`\n\n### 1.5 Configure OpenKnowledge for the wiki repo \u2705 DONE\n- [x] Open OpenKnowledge desktop app\n- [x] Open the `C:\\Users\\maksi\\repos\\wiki` folder as the knowledge base\n- [x] OKF starter pack scaffolded: `concepts/`, `references/`, `notes/`, `external-sources/`, `research/`, `articles/` \u2014 each with `.ok/frontmatter.yml`\n- [x] OKF skill installed (`open-knowledge-pack-okf`) + knowledge-base skill available\n- [x] Reserved files present: `index.md` (navigation hub), `log.md` (change history) \u2014 both frontmatter-free\n- [x] Verify OK MCP server is running (Pi can see `ok_*` / `mcp__open-knowledge__*` tools)\n- [x] `plans/` folder created with `.ok/frontmatter.yml` for planning docs (`type: plan`)\n\n### 1.6 Back up the iCloud vault (15 min)\n- [ ] Create a tagged backup: `cd \"C:\\Users\\maksi\\iCloudDrive\\iCloud~md~obsidian\\obsidian-sync\" && git tag backup-pre-migration-$(date +%Y%m%d)`\n- [ ] Push tag: `git push origin backup-pre-migration-*`\n- [ ] Verify the tag exists: `git tag -l \"backup-*\"`\n\n---\n\n## Phase 2: Structure & Schema (Week 2)\n\n> Goal: Define folder structure, frontmatter conventions, templates, and filing rules for the garden repo.\n\n### 2.1 Audit existing garden repo structure \u2705 DONE (during Task 1.1)\n- [x] List all folders and files \u2014 112 notes in `src/site/notes/` across 15 topic folders\n- [x] Check what 11ty expects \u2014 `src/site/` is input dir, `src/site/notes/` is where notes live, link resolver reads from `./src/site/notes/`\n- [x] All 112 notes already have `\"dg-publish\":true` in JSON frontmatter\n- [x] Decision: keep existing `src/site/notes/` structure, add OK content folders inside it\n\n### 2.2 Define folder structure for the wiki repo \u2705 DONE\n- [x] The wiki repo is the central source of truth (OKF-conformant). The my-digital-garden repo is a publishing consumer \u2014 it only receives notes via the copy script (Phase 5.4).\n- [x] Wiki repo structure (OKF): \n  ```\n  wiki/                             \u2192 central notes repo (source of truth)\n  \u251c\u2500\u2500 .ok/                          \u2192 OK configuration\n  \u2502   \u251c\u2500\u2500 config.yml                \u2192 project config\n  \u2502   \u251c\u2500\u2500 skills/                   \u2192 OK skills (okf, knowledge-base packs)\n  \u2502   \u2514\u2500\u2500 templates/                \u2192 per-folder doc templates\n  \u251c\u2500\u2500 .okignore                     \u2192 OK index exclusions\n  \u251c\u2500\u25 os\\my-digital-garden\\.ok\\skills\\vault-lint.md`\n  ```markdown\n  # Vault Lint Skill\n  \n  Run a vault lint on the garden repo. Do all 8 checks:\n  \n  1. Broken wikilinks: grep all [[wikilinks]] \u2192 cross-reference against actual files\n  2. Orphan pages: find .md files with no inbound [[wikilinks]]\n  3. Contradictions: read pages sharing entities, flag conflicting claims\n  4. Stale claims: cross-reference source dates with content, flag outdated\n  5. Missing pages: find [[wikilinks]] to non-existent pages\n  6. Missing cross-refs: find pages discussing same topics but not linking\n  7. Index consistency: verify index.md matches actual files\n  8. Data gaps: suggest topics mentioned frequently but lacking depth\n  \n  Also: tag audit (duplicates, missing, convention violations), dedup scan.\n  \n  Report grouped by severity (Errors / Warnings / Info).\n  For each: What, Where (file:line), Fix.\n  Log to log.md.\n  ```\n- [ ] Commit to garden repo\n\n### 7.4 Establish weekly lint routine (15 min)\n- [ ] Schedule a recurring calendar reminder: \"Weekly vault lint\" \u2014 every Sunday\n- [ ] When prompted: open a Pi session, paste the lint prompt\n- [ ] Review findings, fix errors, note warnings for later\n- [ ] Total time: 15-30 min per week\n\n### 7.5 Create weekly mechanical lint script (optional, 30 min)\n- [ ] Create `C:\\Users\\maksi\\repos\\scripts\\vault-weekly-mechanical.ps1`:\n  ```powershell\n  # Free mechanical checks \u2014 no LLM needed\n  $gardenPath = \"C:\\Users\\maksi\\repos\\my-digital-garden\"\n  Set-Location $gardenPath\n  \n  # 1. Broken link scan\n  $allLinks = Select-String -Path \"$gardenPath\\**\\*.md\" -Pattern '\\[\\[([^\\]]+)\\]\\]' -AllMatches\n  $broken = @()\n  foreach ($match in $allLinks) {\n      $linkName = $match.Matches[0].Groups[1].Value\n      $targetFile = Get-ChildItem -Path $gardenPath -Filter \"$linkName.md\" -Recurse\n      if (-not $targetFile) { $broken += \"$($match.Path):$($match.LineNumber) \u2192 [[$linkName]]\" }\n  }\n  $broken | Out-File \"$gardenPath\\lint-broken-links.txt\"\n  \n  # 2. Integrity hash\n  $files = Get-ChildItem -Path $gardenPath -Filter \"*.md\" -Recurse\n  $hashes = $files | ForEach-Object { Get-FileHash $_.FullName -Algorithm SHA256 }\n  $hashes | ConvertTo-Json | Out-File \"$gardenPath\\.lint-hash.json\"\n  \n  # 3. Log\n  Add-Content -Path \"$gardenPath\\log.md\" -Value \"## [$(Get-Date -Format 'yyyy-MM-dd')] weekly-mechanical | broken links + hash\"\n  ```\n- [ ] Add to Task Scheduler: Weekly, Sunday 7 AM\n- [ ] Test manually\n\n---\n\n## Phase 8: Polish & Documentation (Week 8)\n\n> Goal: Final migration batch, full lint, document the complete system, plan next steps.\n\n### 8.1 Third migration batch (1 hr)\n- [ ] Pick another 50-100 notes from the iCloud vault\n- [ ] Batch-enrich with Pi (frontmatter, tags, links)\n- [ ] Copy to garden repo\n- [ ] Set `\"dg-publish\":true` on the best 10-20\n- [ ] Push and verify on Vercel\n\n### 8.2 Full vault lint (45 min)\n- [ ] Run the complete Pi lint session\n- [ ] Run the mechanical weekly script\n- [ ] Run OK `links` tool audit\n- [ ] Compare all three \u2014 reconcile findings\n- [ ] Fix all errors\n- [ ] Create a \"health report\" in `log.md`\n\n### 8.3 QMD full re-index (15 min)\n- [ ] `qmd update` (both collections)\n- [ ] `qmd embed -f` (force re-embed everything \u2014 may take 20-30 min for 1,686 files)\n- [ ] `qmd status` \u2014 verify both collections are indexed\n- [ ] Test several searches to confirm quality\n\n### 8.4 Document the complete workflow (30 min)\n- [ ] Update `C:\\Users\\maksi\\repos\\my-digital-garden\\README.md` with:\n  - System architecture (OK + QMD + Pi + Vercel)\n  - Folder structure\n  - Frontmatter conventions\n  - Publishing workflow\n  - Maintenance schedule\n- [ ] Update `C:\\Users\\maksi\\repos\\my-digital-garden\\plans\\personal-wiki-setup-plan.md` with completed items\n- [ ] Create a \"cheat sheet\" of common commands and prompts\n\n### 8.5 Plan next steps (15 min)\n- [ ] Evaluate: how many of the 1,686 notes are now migrated? How many published?\n- [ ] Identify remaining migration batches\n- [ ] Evaluate Quartz: is the current Digital Garden + Vercel sufficient, or switch?\n- [ ] Evaluate OK workflows: are ingest/research/consolidate being used? Should they be?\n- [ ] Plan Phase 9+: ongoing migration, deeper automation, possible Astro migration\n\n---\n\n## Summary: Task Dependencies\n\n```\nPhase 1 (Foundation)\n  1.1 Clone repo \u2500\u252c\u2500\u2192 1.2 Verify Vercel\n                  \u251c\u2500\u2192 1.5 Configure OK\n                  \u2514\u2500\u2192 1.6 Backup vault\n  1.3 Install QMD \u2500\u2192 1.4 Index vault\n\nPhase 2 (Structure) \u2014 depends on Phase 1\n  2.1 Audit repo \u2500\u2192 2.2 Define structure \u2500\u2192 2.3 Frontmatter \u2500\u2192 2.4 Folder frontmatter\n  2.5 RESOLVER.md\n  2.6 Semantic Auto-Linker (independent)\n\nPhase 3 (First Migration) \u2014 depends on Phase 2\n  3.1 Select notes \u2500\u2192 3.2 Migrate 5 manual \u2500\u2192 3.3 Migrate 15 with Pi \u2500\u2192 3.4 Publish 5-10 \u2500\u2192 3.5 Re-index\n\nPhase 4 (Auto-Link & Lint) \u2014 depends on Phase 3\n  4.1 Semantic Auto-Linker run \u2500\u2192 4.2 Tag audit \u2500\u2192 4.3 Full lint \u2500\u2192 4.4 TagItAll (optional)\n  4.5 Evaluate OK workflows (independent)\n\nPhase 5 (Publishing) \u2014 depends on Phase 3\n  5.1 Audit Vercel \u2500\u2192 5.2 Test publish flow \u2500\u2192 5.3 Evaluate Quartz \u2500\u2192 5.4 Document workflow \u2500\u2192 5.5 Publish 10 more\n\nPhase 6 (Second Migration) \u2014 depends on Phases 3-5\n  6.1 Migrate 50-100 \u2500\u2192 6.2 QMD garden collection \u2500\u2192 6.3 QMD MCP for Pi \u2500\u2192 6.4 Second lint \u2500\u2192 6.5 OK link audit\n\nPhase 7 (Automations) \u2014 depends on Phase 1\n  7.1 Daily script \u2500\u2192 7.2 Task Scheduler \u2500\u2192 7.3 Lint template \u2500\u2192 7.4 Weekly routine \u2500\u2192 7.5 Mechanical script\n\nPhase 8 (Polish) \u2014 depends on all\n  8.1 Third batch \u2500\u2192 8.2 Full lint \u2500\u2192 8.3 Full re-index \u2500\u2192 8.4 Document \u2500\u2192 8.5 Plan next\n```\n\n## Quick Reference: Tools & Commands\n\n| Tool | Key command | When |\n|------|------------|------|\n| QMD search | `qmd query \"text\"` | Any time, local, free |\n| QMD keyword | `qmd search \"keyword\"` | Fast exact match |\n| QMD re-index | `qmd update && qmd embed --stale` | After adding notes |\n| QMD MCP | `qmd mcp` | Start MCP server for Pi |\n| OK ingest | Ask Pi: \"ingest this: [URL]\" | When saving a source |\n| OK research | Ask Pi: \"research [topic]\" | When synthesizing |\n| OK consolidate | Ask Pi: \"consolidate [research doc]\" | When promoting to canonical |\n| OK links | Ask Pi: \"find orphans and dead links\" | During lint |\n| Pi lint | Paste vault-lint prompt | Weekly |\n| Semantic Auto-Linker | Obsidian command: \"Analyze whole vault\" | After migration batches |\n| Git sync | `git add -A && git commit && git push` | Daily (automated via Task Scheduler) |\n| Vercel publish | Set `\"dg-publish\":true`, push to GitHub | When ready to publish |", "README": "# digital-garden\nMy digital garden. Collection of my notes and wiki files.\n", "references/payoneer-details": "\nLifeliko Store Amazon : https://www.amazon.com/stores/LIFELIKO/page/5240749F-860D-43E0-8A6B-D6D3D9613C31", "references/payoneer-provide-direct-link-webstore": "\n\nResponse 07/21/2026 07:53 AM\nDear Maksim,\nDue to online financial regulations, we need to confirm that the line of business related to the payment complies with our Terms and Conditions.\nPlease provide a direct link to your webstore such as Amazon, eBay, etc.\nThe page must show at least two of the following: \n\nYour first name and last name\nYou company name shown in your website email address\nYour phone number\nYour email address\nYour primary address that matches the information your provided during registration\nYour picture\nClick here to sign in to your account on our secure platform to submit the required information.\nThank you,\nPayment Department\nCustomer ID:\n15068160\nReference Number:\n260718-004168\nFacebook\tTwitter\tLinkdin\tYoutube\tPayoneer Forum\tPayoneer Blog\n[---002:000594:60790---]\n", "RESOLVER": "# Filing Decision Tree\n\nBefore creating any new page, walk this tree:\n\n1. **Is it a raw source** (URL capture, PDF text, copied file)?\n   \u2192 `external-sources/` \u2014 `type: source`, `public: false`\n   \u2192 Use `ok_workflow({ kind: \"ingest\" })` or manual capture\n\n2. **Is it a provisional synthesis** of multiple sources?\n   \u2192 `research/` \u2014 `type: research`, `status: provisional`, `public: false`\n   \u2192 Every claim cites a doc in `external-sources/`\n   \u2192 Use `ok_workflow({ kind: \"research\" })`\n\n3. **Has it been promoted to canonical** after review?\n   \u2192 `articles/` \u2014 `type: article`, `status: canonical`, `public: false` (or `true` when ready)\n   \u2192 Carries `supersedes:` chain back to `research/` docs\n   \u2192 Use `ok_workflow({ kind: \"consolidate\" })`\n\n4. **Is it a durable idea or definition?**\n   \u2192 `concepts/` \u2014 `type: concept`, `public: false`\n   \u2192 One file per concept; link related concepts\n\n5. **Is it a working note or observation?**\n   \u2192 `notes/` \u2014 `type: note`, `public: false` (or `true` when ready to publish)\n\n6. **Is it an external citation or reference?**\n   \u2192 `references/` \u2014 `type: reference`, `public: false`\n\n7. **Is it a plan or roadmap?**\n   \u2192 `plans/` \u2014 `type: plan`, `public: false`\n\n8. **Not sure?**\n   \u2192 `notes/` with `type: note` \u2014 you can always move it later\n\n## Publishing checklist\n\nBefore setting `public: true`:\n\n- [ ] Frontmatter has `type` (required by OKF)\n- [ ] `title` and `description` are set (for index.md and search)\n- [ ] `tags` are lowercase, hyphenated\n- [ ] `permalink` is set (or let copy script generate from path)\n- [ ] All `[[wikilinks]]` resolve to existing docs (no broken links)\n- [ ] Content is ready to be public (no private info, credentials, PII)\n\n## See also\n\n- [Frontmatter Conventions](./concepts/frontmatter-conventions.md) \u2014 full schema and field reference\n- [Wiki Architecture](./concepts/wiki-architecture.md) \u2014 two-repo architecture", "welcome": "# Welcome\n\nThis knowledge base was scaffolded with the **OKF starter pack**, so it is conformant with the Open Knowledge Format (OKF) from the first commit.\n\n## How it is organized\n\n- [index](./index.md) \u2014 the navigation hub (a reserved OKF file; carries no frontmatter).\n- [log](./log.md) \u2014 the change history (a reserved OKF file; carries no frontmatter).\n- [concepts/](./concepts/), [references/](./references/), [notes/](./notes/) \u2014 your content. Every document here carries a non-empty `type` in its frontmatter.\n\n## The one rule\n\nOKF requires exactly one thing of every non-reserved document: a non-empty `type`. The value is yours to choose \u2014 `concept`, `reference`, `note`, or anything that fits. `Document` is a fine generic fallback.\n\nSee the project skill for the full set of conventions."}, "types": ["Document", "Unknown", "concept", "guide", "note", "plan", "source"], "palette": {"BigQuery Dataset": "#8b5cf6", "BigQuery Table": "#3b82f6", "Reference": "#10b981"}, "questions": {"nodes": [{"data": {"id": "q:external-sources/README:0", "label": "Why OKF?", "kind": "question", "source": "inferred", "answeredBy": ["external-sources/README"]}}, {"data": {"id": "q:notes/add-ollama-cloud-model-to-pi-acp:1", "label": "Q \u2014 What do I edit to add a new cloud model?", "kind": "question", "source": "inferred", "answeredBy": ["notes/add-ollama-cloud-model-to-pi-acp"]}}, {"data": {"id": "q:notes/pi-acp-ollama-connection-error:2", "label": "Why does my Pi ACP chat return empty replies and retry messages?", "kind": "question", "source": "generated", "answeredBy": ["notes/pi-acp-ollama-connection-error"]}}, {"data": {"id": "q:notes/pi-
