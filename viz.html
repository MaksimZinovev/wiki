<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>OKF Bundle Viewer</title>
    <script src="https://cdn.jsdelivr.net/npm/cytoscape@3.28.1/dist/cytoscape.min.js"></script>

    <style>
      * { box-sizing: border-box; }
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  font-size: 14px;
  color: #0f172a;
  background: #f8fafc;
  display: flex;
  flex-direction: column;
  height: 100vh;
}
header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 16px;
  background: #fff;
  border-bottom: 1px solid #e2e8f0;
  flex-shrink: 0;
}
.title strong { font-size: 16px; margin-right: 8px; }
.muted { color: #64748b; font-size: 12px; }
.controls { display: flex; gap: 8px; }
.controls input, .controls select, .controls button {
  font-size: 13px;
  padding: 5px 8px;
  border: 1px solid #cbd5e1;
  border-radius: 4px;
  background: #fff;
}
.controls input { width: 220px; }
.controls button { cursor: pointer; background: #f1f5f9; }
.controls button:hover { background: #e2e8f0; }

main {
  display: flex;
  flex: 1;
  min-height: 0;
}
#graph {
  flex: 1 1 60%;
  background: #fff;
  border-right: 1px solid #e2e8f0;
  min-width: 0;
  position: relative;
}
#detail {
  flex: 0 0 40%;
  overflow-y: auto;
  padding: 18px 22px;
  background: #fff;
}
#detail-empty {
  text-align: center;
  margin-top: 40px;
}

.detail-header { margin-bottom: 12px; }
.detail-header h1 {
  font-size: 18px;
  margin: 4px 0 2px;
  font-weight: 600;
}
.type-chip {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 10px;
  font-size: 11px;
  font-weight: 600;
  color: #fff;
  background: #94a3b8;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
dl.frontmatter {
  display: grid;
  grid-template-columns: 90px 1fr;
  row-gap: 4px;
  column-gap: 12px;
  margin: 8px 0 12px;
  font-size: 13px;
}
dl.frontmatter dt {
  color: #64748b;
  font-weight: 500;
}
dl.frontmatter dd { margin: 0; }
dl.frontmatter a { color: #2563eb; word-break: break-all; }

.tag {
  display: inline-block;
  padding: 1px 6px;
  margin: 0 4px 2px 0;
  border-radius: 4px;
  background: #f1f5f9;
  color: #475569;
  font-size: 11px;
}

.badges {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin: 8px 0 4px;
}
.badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 10px;
  font-size: 11px;
  font-weight: 600;
  border: 1px solid transparent;
}
.badge.status-stable { background: #ecfdf5; color: #047857; border-color: #a7f3d0; }
.badge.status-draft { background: #fefce8; color: #a16207; border-color: #fde68a; }
.badge.status-deprecated { background: #f1f5f9; color: #64748b; border-color: #cbd5e1; text-decoration: line-through; }
.badge.trust-unverified { background: #f1f5f9; color: #64748b; border-color: #cbd5e1; }
.badge.trust-machine-confirmed { background: #eff6ff; color: #1d4ed8; border-color: #bfdbfe; }
.badge.trust-human-reviewed { background: #f5f3ff; color: #6d28d9; border-color: #ddd6fe; }
.badge.stale { background: #fef2f2; color: #b91c1c; border-color: #fecaca; }
.badge.fresh { background: #ecfdf5; color: #047857; border-color: #a7f3d0; }

.sources-list { padding-left: 18px; margin: 0; }
.sources-list li { margin: 1px 0; }

hr { border: none; border-top: 1px solid #e2e8f0; margin: 14px 0; }

#detail-body { font-size: 13px; line-height: 1.55; }
#detail-body h1 {
  font-size: 16px; margin: 18px 0 6px;
  padding-bottom: 4px; border-bottom: 1px solid #e2e8f0;
}
#detail-body h2 { font-size: 14px; margin: 14px 0 4px; }
#detail-body h3 { font-size: 13px; margin: 12px 0 4px; }
#detail-body p { margin: 6px 0; }
#detail-body code {
  background: #f1f5f9;
  padding: 1px 4px;
  border-radius: 3px;
  font-size: 12px;
  font-family: ui-monospace, "SF Mono", Consolas, monospace;
}
#detail-body pre {
  background: #0f172a;
  color: #e2e8f0;
  padding: 10px 12px;
  border-radius: 6px;
  overflow-x: auto;
  font-size: 12px;
}
#detail-body pre code { background: transparent; color: inherit; padding: 0; }
#detail-body ul, #detail-body ol { padding-left: 22px; margin: 6px 0; }
#detail-body li { margin: 2px 0; }
#detail-body table { border-collapse: collapse; margin: 8px 0; }
#detail-body th, #detail-body td {
  border: 1px solid #e2e8f0; padding: 4px 8px; font-size: 12px;
}
#detail-body a.internal { color: #2563eb; cursor: pointer; }
#detail-body a.external { color: #2563eb; }

#detail-backlinks { margin-top: 18px; }
#detail-backlinks h2 { font-size: 13px; color: #64748b; margin-bottom: 6px; }
#detail-backlinks ul { padding-left: 18px; }
#detail-backlinks a { color: #2563eb; cursor: pointer; }

/* Questions board (# view toggle) */
.view-toggle { display: inline-flex; margin-right: 8px; }
.view-toggle button {
  border: 1px solid #cbd5e1;
  background: #f8fafc;
  padding: 4px 10px;
  font-size: 12px;
  cursor: pointer;
}
.view-toggle button:first-child { border-radius: 4px 0 0 4px; }
.view-toggle button:last-child { border-radius: 0 4px 4px 0; border-left: none; }
.view-toggle button.active { background: #0f172a; color: #fff; }
.view-toggle button:disabled { opacity: 0.5; cursor: not-allowed; }
.pinned-question {
  background: #fffbeb;
  border-left: 3px solid #f59e0b;
  padding: 8px 12px;
  margin-bottom: 14px;
  font-style: italic;
  border-radius: 0 4px 4px 0;
}

    </style>

  <body>
    <header>
      <div class="title">
        <strong id="bundle-name"></strong>
        <span class="muted">OKF bundle</span>
      </div>
      <div class="controls">
        <div class="view-toggle">
          <button id="view-concepts" title="Concepts graph (Ctrl+1)">
            1 Concepts
          </button>
          <button id="view-questions" title="Questions board (Ctrl+2)">
            2 Questions
          </button>
        </div>
        <input
          id="search"
          type="search"
          placeholder="Search title / id / tag"
        />
        <select id="filter-type">
          <option value="">All types</option>
        </select>
        <select id="layout">
          <option value="cose">cose (force)</option>
          <option value="concentric">concentric</option>
          <option value="breadthfirst">breadth-first</option>
          <option value="circle">circle</option>
          <option value="grid">grid</option>
        </select>
        <button id="reset">Reset view</button>
      </div>
    </header>

    <main>
      <section id="graph"></section>
      <section id="detail">
        <div id="detail-empty" class="muted">
          Click a node to see its details.
        </div>
        <article id="detail-content" hidden>
          <div id="detail-question" class="pinned-question" hidden></div>
          <header class="detail-header">
            <span class="type-chip" id="detail-type"></span>
            <h1 id="detail-title"></h1>
            <div class="muted" id="detail-id"></div>
          </header>
          <div class="badges" id="detail-badges"></div>
          <dl class="frontmatter">
            <dt>Description</dt>
            <dd id="detail-description"></dd>
            <dt>Resource</dt>
            <dd id="detail-resource"></dd>
            <dt>Tags</dt>
            <dd id="detail-tags"></dd>
            <dt>Generated</dt>
            <dd id="detail-generated"></dd>
            <dt>Verified</dt>
            <dd id="detail-verified"></dd>
            <dt>Sources</dt>
            <dd id="detail-sources"></dd>
          </dl>
          <hr />
          <div id="detail-body"></div>
          <section id="detail-backlinks" hidden>
            <h2>Cited by</h2>
            <ul id="backlinks-list"></ul>
          </section>
        </article>
      </section>
    </main>

-sources/SPEC", "source": "concepts/frontmatter-conventions", "target": "external-sources/SPEC"}}, {"data": {"id": "concepts/frontmatter-conventions__concepts/wiki-architecture", "source": "concepts/frontmatter-conventions", "target": "concepts/wiki-architecture"}}, {"data": {"id": "concepts/frontmatter-conventions__RESOLVER", "source": "concepts/frontmatter-conventions", "target": "RESOLVER"}}, {"data": {"id": "concepts/wiki-architecture__external-sources/SPEC", "source": "concepts/wiki-architecture", "target": "external-sources/SPEC"}}, {"data": {"id": "concepts/wiki-architecture__plans/personal-wiki-setup-plan", "source": "concepts/wiki-architecture", "target": "plans/personal-wiki-setup-plan"}}, {"data": {"id": "external-sources/README__external-sources/SPEC", "source": "external-sources/README", "target": "external-sources/SPEC"}}, {"data": {"id": "log__notes/auto-updating-progress-card-pre-commit-hook", "source": "log", "target": "notes/auto-updating-progress-card-pre-commit-hook"}}, {"data": {"id": "log__plans/personal-wiki-setup-plan", "source": "log", "target": "plans/personal-wiki-setup-plan"}}, {"data": {"id": "log__concepts/frontmatter-conventions", "source": "log", "target": "concepts/frontmatter-conventions"}}, {"data": {"id": "log__RESOLVER", "source": "log", "target": "RESOLVER"}}, {"data": {"id": "log__concepts/wiki-architecture", "source": "log", "target": "concepts/wiki-architecture"}}, {"data": {"id": "notes/auto-updating-progress-card-pre-commit-hook__plans/personal-wiki-setup-plan", "source": "notes/auto-updating-progress-card-pre-commit-hook", "target": "plans/personal-wiki-setup-plan"}}, {"data": {"id": "plans/personal-wiki-setup-plan__concepts/wiki-architecture", "source": "plans/personal-wiki-setup-plan", "target": "concepts/wiki-architecture"}}, {"data": {"id": "plans/personal-wiki-setup-plan__concepts/frontmatter-conventions", "source": "plans/personal-wiki-setup-plan", "target": "concepts/frontmatter-conventions"}}, {"data": {"id": "plans/personal-wiki-setup-plan__RESOLVER", "source": "plans/personal-wiki-setup-plan", "target": "RESOLVER"}}, {"data": {"id": "RESOLVER__concepts/frontmatter-conventions", "source": "RESOLVER", "target": "concepts/frontmatter-conventions"}}, {"data": {"id": "RESOLVER__concepts/wiki-architecture", "source": "RESOLVER", "target": "concepts/wiki-architecture"}}, {"data": {"id": "welcome__log", "source": "welcome", "target": "log"}}], "bodies": {".ok/skills/open-knowledge-pack-knowledge-base/SKILL": "# Knowledge Base pack \u2014 how to work here\n\nThis project uses the **source-grounded knowledge-base** layout. The whole point is a closed evidence loop: nothing canonical exists without a traceable chain back to a preserved source. This skill holds the workflow so the templates and `log.md` can stay clean \u2014 when you create a doc from a template you get structure, and the *how* lives here.\n\n> This skill is pack guidance. The platform `open-knowledge` skill (read/write/preview/grounding rules) still governs every markdown operation \u2014 this layers the KB workflow on top.\n\n## Link at creation\n\nThe user watches your build live \u2014 the editor follows the file you're writing, and the knowledge graph assembles on screen as pages get linked. No view management on your part; just author well: every page carries its links from the moment it's written (at minimum the hub/index page and its most related siblings \u2014 an unlinked page is invisible in the graph), and related pages share a `cluster:` frontmatter value (e.g. `cluster: architecture`) so the graph's cluster coloring makes the map read at a glance.\n\n## The three layers\n\n```\nexternal-sources/   raw sources, saved verbatim     (produced by `ingest`)\n      \u2193 cite\nresearch/           provisional analysis            (produced by `research`)\n      \u2193 promote\narticles/           canonical, decided knowledge     (produced by `consolidate`)\n```\n\nThe loop is **ingest \u2192 research \u2192 consolidate** \u2014 each a `workflow({ kind })` guide you invoke (`workflow({ kind: 'ingest' })`, etc.). Every downstream claim traces upstream to a preserved source. Cite local paths in `external-sources/`, never bare web URLs \u2014 the KB must survive link rot.\n\n## Per-folder rules\n\n**`external-sources/`** \u2014 Raw sources saved verbatim, not just cited: the actual fetched text of URLs, extracted text of PDFs, copies of referenced files. Each file's frontmatter carries the original URL, access date, and any author/publisher metadata. Produced by `ingest` (applies whether the user shared the URL or you fetched it yourself to ground a claim). Immutable after capture \u2014 update only to refresh a stale fetch. **No analysis here**; that belongs in `research/`.\n\n**`research/`** \u2014 Provisional analysis synthesizing external sources. Produced by `research`. Every factual claim cites a specific doc in `external-sources/` (or an inline URL if ingest was skipped); no unsourced assertions. Keep the `sources:` frontmatter list aligned with the docs actually linked in the body. Promote to `articles/` via `consolidate` once the team decides the findings are stable.\n\n**`articles/`** \u2014 Canonical knowledge, committed after a team decision. Produced by `consolidate`. Carries a `supersedes:` chain tying back to the `research/` docs it replaces (which in turn cite `external-sources/`) so the full evidence chain is traceable without leaving the repo. Source-of-truth for the domain; update only when a new decision supersedes it.\n\n## Status flow\n\n| Layer | `status` | Set when |\n|---|---|---|\n| `research/` | `provisional` | created |\n| `articles/` | `canonical` | promoted by `consolidate` after a decision |\n\nWhen a new article supersedes an older one, add the older article's path to the new one's `supersedes:` list.\n\n## Log discipline (MUST)\n\nThere is a `log.md` at the project root. **Append one dated entry after any turn that creates, edits, or restructures content** \u2014 one entry per turn, not per file. Silent edits break the audit trail.\n\nLog: `ingest` runs (new sources), `research` / `consolidate` runs (provisional or canonical articles), direct `write` / `edit` / `move` / `delete` outside the three loop tools, `discover` runs, folder restructures, and `.ok/config.yml` changes.\n\n**Reference docs as markdown links, not bare paths** \u2014 `[path/to/doc](./path/to/doc.md)`, so the entry shows up in `links({ kind: \"backlinks\" })` for those docs. A bare path string does not register in the graph.\n\nEntry shape:\n\n```markdown\n## YYYY-MM-DD: <short title>\n\n- <what was done>\n- Files touched: [doc-a](./path/doc-a.md), [doc-b](./path/doc-b.md)\n- Sources ingested: [source-slug](./external-sources/source-slug.md)\n- Open follow-ups: <topic-1>, <topic-2>\n```\n\n## Templates\n\nEach folder has a starter template (`clip`, `research-log`, `article`). Create with `write({ document: { path, template: \"<name>\" } })`. Templates carry only structure (headings + frontmatter scaffold) \u2014 the meaning of each field and section is described above, not repeated inside the document body.", ".ok/skills/open-knowledge-pack-okf/SKILL": "# OKF starter pack \u2014 how to work here\n\nThis project was scaffolded to be conformant with **Google's Open Knowledge Format (OKF) v0.1** from the first commit \u2014 markdown + YAML frontmatter, a standard-markdown link graph, and two reserved files. Conformance here is pre-populated, **not enforced**: OpenKnowledge's native frontmatter schema stays open-shaped, nothing is linted, and you are free to author however you like. This skill explains the conventions so the kit stays OKF-portable as it grows.\n\n> This skill is pack guidance. The platform `open-knowledge` skill (read/write/preview/grounding rules) still governs every markdown operation \u2014 this layers OKF conventions on top.\n\n## The one rule (keep the kit conformant)\n\nOKF requires exactly one thing of every **non-reserved** document: a **non-empty `type`** in its frontmatter. That is the whole conformance contract for your content.\n\n- The value is **yours to choose** \u2014 `concept`, `reference`, `note`, `person`, `event`, anything that fits. There is no blessed taxonomy.\n- `Document` is a fine **generic fallback** when nothing more specific fits (it is just a non-empty value, not a special keyword).\n- The folder templates already set a sensible `type` per section \u2014 create docs with `write({ document: { path, template: \"<name>\" } })` and you inherit it.\n\n## Folders\n\n- **`concepts/`** \u2014 durable ideas and definitions, one file per concept (`type: concept`).\n- **`references/`** \u2014 external sources and citations you rely on (`type: reference`).\n- **`notes/`** \u2014 working notes and observations (`type: note`).\n\nLink liberally with **standard markdown links** (`[text](./path.md)`) \u2014 the value is the graph that emerges from the links between typed docs, and standard links keep that graph portable to any OKF consumer. (OpenKnowledge also accepts `[[wiki-link]]` shorthand as a native superset and preserves it byte-for-byte \u2014 but seeded content uses standard links so the bundle is conformant as-is.)\n\n## Reserved files (keep them frontmatter-free)\n\nOKF reserves two lowercase files at the project root. **Neither carries frontmatter** \u2014 adding any frontmatter to a reserved file breaks OKF conformance.\n\n- **`index.md`** (OKF \u00a76) \u2014 the navigation hub: a link-list to the key docs and sections. Keep it current as you add important docs; it is how a reader (or a strict OKF consumer) finds their way in.\n- **`log.md`** (OKF \u00a77) \u2014 the change history: newest-first dated entries shaped `## YYYY-MM-DD: <summary>`. Add an entry whenever you create, edit, or restructure content. The seed ships a prose instruction documenting this format \u2014 add your first dated entry on your first edit.\n\nThe tool does not keep these live for you (that would be enforcement) \u2014 maintaining them is part of authoring here.\n\n## What stays OKF-portable\n\n- Every non-reserved doc has a non-empty `type`. \u2705\n- `index.md` / `log.md` stay lowercase and frontmatter-free. \u2705\n- Links use standard markdown / wiki-link syntax. \u2705\n\nIf you ever want to hand this knowledge base to a strict OKF consumer, those three habits are all it takes.", "concepts/frontmatter-conventions": "# Frontmatter Conventions\n\nThe wiki repo uses **YAML frontmatter** (OKF convention). Every non-reserved document carries a non-empty `type` \u2014 that is the only OKF requirement. The conventions below layer project-specific fields on top.\n\n## Schema\n\n```yaml\n---\n# === OKF required ===\ntype: note                    # REQUIRED \u2014 note | concept | reference | source | research | article | plan | guide\n\n# === OKF recommended ===\ntitle: \"Note Title\"           # Display name; if omitted, derived from filename\ndescription: \"One-line summary\" # Used by index.md generators, search, and previews\ntags: [tag-one, tag-two]      # lowercase, hyphenated\n\n# === OKF optional (provenance, trust, lifecycle) ===\ngenerated:                    # Who produced this and when\n  by: human:maksi\n  at: 2026-07-30\nstatus: stable                # draft | stable | deprecated (absent = stable)\nsources:                      # For research/article docs citing external-sources/\n  - id: source-id\n    resource: ./external-sources/source-file.md\n    title: \"Source Title\"\n\n# === Project-specific (publishing) ===\npublic: false                 # true = copy script includes in publishing sync; false/absent = private\npermalink: /topic/note-name/  # Optional URL path for publishing; if absent, copy script generates from file path\n---\n```\n\n## The `public` field\n\nReplaces the Digital Garden plugin's `\"dg-publish\": true` JSON convention. In the wiki repo, notes use the universal YAML field `public: true` or `public: false`. Notes are **private by default** \u2014 `public` is absent or `false` unless explicitly set to `true`.\n\n### Why `public` instead of `dg-publish`\n\n- **Vendor-neutral** \u2014 not tied to the Digital Garden Obsidian plugin\n- **Self-explanatory** \u2014 `public: true` is immediately readable by any human or agent\n- **OKF-portable** \u2014 any OKF consumer understands a boolean field; `dg-publish` is opaque outside the Digital Garden ecosystem\n\n## Copy script transformation (wiki YAML \u2192 my-digital-garden JSON)\n\nThe sync script (`sync-wiki-to-garden.ps1`) transforms frontmatter when copying to the publishing consumer:\n\n| Wiki (YAML) | \u2192 | my-digital-garden (JSON) | Notes |\n|-------------|---|---------------------------|-------|\n| `public: true` | \u2192 | `\"dg-publish\":true` | Filter: only `public: true` notes are copied |\n| `public: false` (or absent) | \u2192 | (not copied) | Private notes stay in wiki |\n| `permalink: /path/` | \u2192 | `\"permalink\":\"/path/\"` | If absent, generated from file path |\n| `tags: [a, b]` | \u2192 | `\"tags\":[\"a\",\"b\"]` | Direct conversion |\n| `title: \"Title\"` | \u2192 | (not included) | 11ty derives title from filename |\n| `type: note` | \u2192 | (stripped) | OKF-only field, not needed by 11ty |\n| `generated: {...}` | \u2192 | (stripped) | OKF provenance, not needed by 11ty |\n| `status: stable` | \u2192 | (stripped) | OKF lifecycle, not needed by 11ty |\n\n## Tag conventions\n\n- **Lowercase, hyphenated**: `knowledge-management`, not `Knowledge Management` or `KM`\n- **Topic-based**: `pkm`, `ai-agents`, `testing`, `git`\n- **Consistent**: pick one form per concept and stick with it (no `ai` + `AI` + `artificial-intelligence` mixing)\n\n## Per-folder defaults\n\nEach folder's `.ok/frontmatter.yml` sets a default `type` and `public: false`:\n\n| Folder | Default `type` | Default `public` | Default `status` |\n|--------|---------------|-------------------|-------------------|\n| `concepts/` | `concept` | `false` | \u2014 |\n| `references/` | `reference` | `false` | \u2014 |\n| `notes/` | `note` | `false` | \u2014 |\n| `external-sources/` | `source` | `false` | \u2014 |\n| `research/` | `research` | `false` | `provisional` |\n| `articles/` | `article` | `false` | `canonical` |\n| `plans/` | `plan` | `false` | \u2014 |\n\n## Example: a publishable note\n\nWiki repo (YAML):\n\n```yaml\n---\ntype: note\ntitle: \"Karpathy LLM Wiki\"\ndescription: \"Notes on Karpathy's LLM-wiki gist \u2014 the pattern OKF formalizes.\"\ntags: [knowledge-management, llm-wiki, okf]\npublic: true\npermalink: /resources/pkm/karpathy-llm-wiki/\ngenerated:\n  by: human:maksi\n  at: 2026-07-30\nstatus: stable\n---\n```\n\nCopy script transforms to my-digital-garden (JSON):\n\n```json\n---\n{\"dg-publish\":true,\"permalink\":\"/resources/pkm/karpathy-llm-wiki/\",\"tags\":[\"knowledge-management\",\"llm-wiki\",\"okf\"]}\n---\n```\n\n## See also\n\n- [OKF Specification](../external-sources/SPEC.md) \u2014 the format these conventions conform to\n- [Wiki Architecture](./wiki-architecture.md) \u2014 the two-repo architecture and copy script\n- [Filing Decision Tree](../RESOLVER.md) \u2014 where new notes go", "concepts/wiki-architecture": "# Wiki Architecture\n\nThe system separates **notes** (the source of truth) from **publishing** (how notes reach the web). One central wiki repo feeds multiple static-site consumers; the publishing engine can change without touching the notes.\n\n## Diagram\n\n```mermaid\ngraph LR\n    subgraph Source of Truth\n        Wiki[\"wiki repo<br/>OKF-conformant markdown\"]\n    end\n    subgraph Publishing Consumers\n        DG[\"my-digital-garden<br/>11ty + Vercel\"]\n        Quartz[\"Quartz<br/>(future)\"]\n        Astro[\"Astro<br/>(future)\"]\n    end\n    Wiki -->|\"copy script<br/>(build-time sync)\"| DG\n    Wiki -.->|future| Quartz\n    Wiki -.->|future| Astro\n```\n\n## Repositories\n\n| Repo | Path | Role | Tech |\n|------|------|------|------|\n| **wiki** | `C:\\Users\\maksi\\repos\\wiki` | Central notes \u2014 source of truth | OKF markdown + OpenKnowledge |\n| **my-digital-garden** | `C:\\Users\\maksi\\repos\\my-digital-garden` | Publishing consumer (current) | 11ty + Vercel |\n| (future) | \u2014 | Publishing consumer | Quartz or Astro |\n\n## Principles\n\n1. **Notes stay in the wiki repo.** All authoring, editing, linking, and knowledge work happens here. The wiki repo is [OKF-conformant](../external-sources/SPEC.md) \u2014 every non-reserved document carries a non-empty `type` in its frontmatter.\n2. **Publishing engines are interchangeable.** Each consumer reads from the wiki repo via a sync mechanism (currently a build-time copy script) and renders with its own stack. Adding a new consumer (Quartz, Astro) does not change a single note.\n3. **The copy script filters by frontmatter.** Notes with `dg-publish: true` (JSON frontmatter convention from the Digital Garden plugin) are copied to the publishing consumer; the rest stay private in the wiki repo.\n4. **OKF conventions keep the wiki portable.** Standard markdown links, YAML frontmatter with `type`, and the reserved `index.md` / `log.md` files mean any OKF consumer can read the wiki without translation.\n\n## Wiki repo structure (OKF)\n\n```\nwiki/\n\u251c\u2500\u2500 index.md              \u2192 navigation hub (reserved, no frontmatter)\n\u251c\u2500\u2500 log.md                \u2192 change history (reserved, no frontmatter)\n\u251c\u2500\u2500 concepts/             \u2192 durable ideas and definitions (type: concept)\n\u251c\u2500\u2500 references/           \u2192 external sources and citations (type: reference)\n\u251c\u2500\u2500 notes/                \u2192 working notes (type: note)\n\u251c\u2500\u2500 external-sources/     \u2192 raw sources, verbatim (type: source)\n\u251c\u2500\u2500 research/             \u2192 provisional analysis (type: research)\n\u251c\u2500\u2500 articles/             \u2192 canonical knowledge (type: article)\n\u251c\u2500\u2500 plans/                \u2192 planning documents (type: plan)\n\u2514\u2500\u2500 images/               \u2192 image assets\n```\n\n## Publishing pipeline\n\n```\nwiki repo                copy script              my-digital-garden\n\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500    \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\nnotes/**/*.md  \u2192  filter dg-publish:true  \u2192  src/site/notes/\nimages/**      \u2192  copy all               \u2192  src/site/img/user/\n```\n\nThe copy script runs at build time (locally before `git push`, or in CI). It copies publishable notes from the wiki repo into `my-digital-garden/src/site/notes/`, preserving folder structure. Vercel then deploys the 11ty site.\n\n## See also\n\n- [Personal Wiki Setup \u2014 Phased Plan](../plans/personal-wiki-setup-plan.md) \u2014 the 8-week roadmap\n- [OKF Specification](../external-sources/SPEC.md) \u2014 the format the wiki repo conforms to\n- [OKF Announcement](https://cloud.google.com/blog/products/data-analytics/how-the-open-knowledge-format-can-improve-data-sharing) \u2014 Google Cloud Blog post introducing OKF (raw capture in `external-sources/`)", "external-sources/Introducing the Open Knowledge Format - Google Blog": "# How the Open Knowledge Format can improve data sharing | Google Cloud Blog\n\nData Analytics\n\n# \n\nIntroducing the Open Knowledge Format\n\nJune 13, 2026\n\n-   [](https://x.com/intent/tweet?text=Introducing%20the%20Open%20Knowledge%20Format%20@googlecloud&url=https://cloud.google.com/blog/products/data-analytics/how-the-open-knowledge-format-can-improve-data-sharing)\n-   [](https://www.linkedin.com/shareArticle?mini=true&url=https://cloud.google.com/blog/products/data-analytics/how-the-open-knowledge-format-can-improve-data-sharing&title=Introducing%20the%20Open%20Knowledge%20Format)\n-   [](https://www.facebook.com/sharer/sharer.php?caption=Introducing%20the%20Open%20Knowledge%20Format&u=https://cloud.google.com/blog/products/data-analytics/how-the-open-knowledge-format-can-improve-data-sharing)\n-   [](mailto:?subject=Introducing%20the%20Open%20Knowledge%20Format&body=Check%20out%20this%20article%20on%20the%20Cloud%20Blog:%0A%0AIntroducing%20the%20Open%20Knowledge%20Format%0A%0ALearn%20how%20the%20Open%20Knowledge%20Format%20helps%20secure%20data%20sharing%20and%20improves%20collaboration%20across%20teams%20with%20standardized%20documentation.%0A%0Ahttps://cloud.google.com/blog/products/data-analytics/how-the-open-knowledge-format-can-improve-data-sharing)\n\n##### Sam McVeety\n\nTech Lead, Data Analytics, Engineering, Data Cloud\n\n##### Amir Hormati\n\nTech Lead, BigQuery, Engineering, Data Cloud\n\n##### Try Gemini Enterprise Business Edition today\n\nThe front door to AI in the workplace\n\n[Try now](https://business.gemini.google/?utm_source=cloud.google.com/blog&utm_medium=et&utm_campaign=FY26-Q2-GLOBAL-GLO27877-physicalevent-er-next26-mc-105752)\n\nAs foundation models continue to improve, the lack of relevant context often limits what they can do, especially as they are used to build agentic systems. While these models can help you write code, summarize documents, or analyze a dataset, they still need the right information to produce accurate and actionable results.\u00a0\n\nThat\u2019s why today, we\u2019re introducing the Open Knowledge Format (OKF), an open specification that formalizes the [LLM-wiki](https://gist.github.com/karpathy/442a6bf555914893e9891c11519de94f)\u00a0pattern into a portable, interoperable format. This is a vendor-neutral, agent- and human-friendly standard for representing the metadata, context, and curated knowledge that modern AI systems need.\n\nAs published, **OKF v0.1** represents knowledge as a directory of markdown files with YAML frontmatter, with a small set of agreed-upon conventions that let wikis written by different producers be consumed by different agents without translation.\n\nThat's it. No complex compression scheme, no new runtime, no required SDK. A bundle of OKF documents is:\n\n-   **Just markdown** \u2014 readable in any editor, renderable on GitHub, indexable by any search tool\n    \n-   **Just files** \u2014 shippable as a tarball, hostable in any git repo, mountable on any filesystem\n    \n-   **Just YAML frontmatter** \u2014 for the small set of structured fields that need to be queryable: type, title, description, resource, tags, and timestamp\n    \n\nIf you've used Obsidian, Notion, Hugo, or any of the LLM wiki patterns that have emerged over the past year, the shape will feel familiar. OKF formalizes the small set of conventions needed to make these patterns interoperable.\n\nLet\u2019s take a look at the problem that OKF can solve for your organization, how it works, how to get started with it, and what\u2019s next.\n\n### A fragmented context landscape\n\nIn most organizations, the information that foundation models use is overwhelmingly internal knowledge: the schema of a table, your business\u2019 meaning of a metric, the runbook for an incident, the join paths between two systems, the deprecation notice for an old API, etc.\n\nToday, these atoms of knowledge live in a variety of highly fragmented systems:\n\n-   Metadata catalogs with their own APIs\n    \n-   Wikis, third-party systems, or in shared drives\n    \n-   Code comments, docstrings, or notebook cells\n    \n-   The heads of a few senior engineers\n    \n\nWhen an AI agent needs to answer \"How do I compute weekly active users from our event stream?\" it has to assemble the answer from these scattered, mutually incompatible surfaces. Every vendor offers its own catalog, its own SDK, its own knowledge-graph schema, and none of the knowledge is easily portable across products or organizations.\n\nThe result: Every agent builder is solving the same context-assembly problem from scratch, every catalog vendor is reinventing the same data models, and the knowledge itself is locked behind whichever surface created it.\n\n### Knowledge as a living wiki\n\nDeveloper teams are changing how they build AI agents. Instead of using models to search the same documents for the same facts over and over, you can give your agents a shared markdown library that grows more useful over time. This lets your agents take on the drudgery of reading and updating their own files, while your team curates the content and manages it like code.\u00a0\n\nAndrej Karpathy, the prominent AI researcher and educator, articulates this idea most crisply in his [LLM Wiki gist](https://gist.github.com/karpathy/442a6bf555914893e9891c11519de94f). \"LLMs don't get bored, don't forget to update a cross-reference, and can touch 15 files in one pass,\" he writes. The bookkeeping that causes humans to abandon personal wikis is exactly what LLMs are good at.\n\nSimilar knowledge-as-Wiki pattern keeps reappearing under different names: [Obsidian vaults](https://obsidian.md/help/vault) wired to coding agents, the AGENTS.md / CLAUDE.md family of convention files, repos full of index.md and log.md artifacts that agents consult before doing real work, and \"metadata as code\" repositories inside data teams.\u00a0\n\nThe pattern is compelling and powerful, but each instance is bespoke. Karpathy's wiki and your team's wiki and a vendor's catalog export may all look alike (markdown, frontmatter, cross-links), but none of them are intentionally designed to cooperate. There is no agreed-upon answer to what fields every document should carry, or what filenames mean what. As a result, the knowledge encoded in wikis remains siloed within the original teams, leading to redundant effort whenever a new agent is built.\n\n### What's missing is a format, not another service\n\nThe answer to this problem isn\u2019t another knowledge service. You need a **format**, a way to represent knowledge that:\n\n-   Anyone can produce, without an SDK\n    \n-   Anyone can consume, without an integration\n    \n-   Survives moving between systems, organizations, and tools\n    \n-   Lives in version control alongside the code it describes\n    \n-   Is readable by humans and parseable by agents: the same file, no translation layer\n    \n\nBy design, OKF is that format.\u00a0\n\n### How OKF works: The design in one screen\n\nAn OKF **bundle** is a directory of markdown files representing **concepts:** anything you want to capture, including tables, datasets, metrics, playbooks, runbooks, and APIs. Each concept is one file. The file path is the concept's identity:\n\nsales/ \u251c\u2500\u2500 index.md \u251c\u2500\u2500 datasets/ \u2502 \u251c\u2500\u2500 index.md \u2502 \u2514\u2500\u2500 orders\\_db.md \u251c\u2500\u2500 tables/ \u2502 \u251c\u2500\u2500 index.md \u2502 \u251c\u2500\u2500 orders.md \u2502 \u2514\u2500\u2500 customers.md \u2514\u2500\u2500 metrics/ \u2502 \u251c\u2500\u2500 index.md \u2514\u2500\u2500 weekly\\_active\\_users.md\n\n1\n\nsales/\n\n2\n\n\u251c\u2500\u2500 index.md\n\n3\n\n\u251c\u2500\u2500 datasets/\n\n4\n\n\u2502 \u00a0 \u251c\u2500\u2500 index.md\n\n5\n\n\u2502 \u00a0 \u2514\u2500\u2500 orders\\_db.md\n\n6\n\n\u251c\u2500\u2500 tables/\n\n7\n\n\u2502 \u00a0 \u251c\u2500\u2500 index.md\n\n8\n\n\u2502 \u00a0 \u251c\u2500\u2500 orders.md\n\n9\n\n\u2502 \u00a0 \u2514\u2500\u2500 customers.md\n\n10\n\n\u2514\u2500\u2500 metrics/\n\n11\n\n\u2502 \u00a0 \u251c\u2500\u2500 index.md\n\n12\n\n \u00a0 \u00a0 \u2514\u2500\u2500 weekly\\_active\\_users.md\n\nEach concept document has a small block of YAML front matter for structured fields and a markdown body for everything else:\n\n\\--- type: BigQuery Table title: Orders description: One row per completed customer order. resource: https://console.cloud.google.com/bigquery?p=acme&d=sales&t=orders tags: \\[sales, revenue\\] timestamp: 2026-05-28T14:30:00Z --- # Schema | Column | Type | Description | |---------------|-----------|------------------------------------------| | \\`order\\_id\\` | STRING | Globally unique order identifier. | | \\`customer\\_id\\` | STRING | FK to \\[customers\\](/tables/customers.md). | # Joins Joined with \\[customers\\](/tables/customers.md) on \\`customer\\_id\\`.\n\n\u200bx\n\n1\n\n\\---\n\n2\n\ntype: BigQuery Table\n\n3\n\ntitle: Orders\n\n4\n\ndescription: One row per completed customer order.\n\n5\n\nresource: https://console.cloud.google.com/bigquery?p=acme&d\\=sales&t\\=orders\n\n6\n\ntags: \\[sales, revenue\\]\n\n7\n\ntimestamp: 2026-05-28T14:30:00Z\n\n8\n\n\\---\n\n9\n\n\u200b\n\n10\n\n\\# Schema\n\n11\n\n\u200b\n\n12\n\n| Column \u00a0 \u00a0 \u00a0  | Type \u00a0 \u00a0  | Description \u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \u00a0 \u00a0  |\n\n13\n\n|---------------|-----------|------------------------------------------|\n\n14\n\n| \\`order\\_id\\` \u00a0  | STRING \u00a0  | Globally unique order identifier. \u00a0 \u00a0 \u00a0  |\n\n15\n\n| \\`customer\\_id\\` | STRING \u00a0  | FK to \\[customers\\](/tables/customers.md). |\n\n16\n\n\u200b\n\n17\n\n\\# Joins\n\n18\n\n\u200b\n\n19\n\nJoined with \\[customers\\](/tables/customers.md) on \\`customer\\_id\\`.\n\nConcepts link to each other with normal markdown links, turning the directory into a **graph** of relationships that is richer than the parent/child links implied by the file system. Bundles can optionally include index.md files (for progressive disclosure as agents navigate the hierarchy) and log.md files (for chronological history of changes).\n\nThe full v0.1 specification (including conformance criteria, cross-linking rules, and the small number of reserved filenames) fits on a single page.\n\n### Three principles behind the design\n\n**1\\. Minimally opinionated.** OKF requires exactly one thing of every concept: a type field. Everything else (e.g., what types exist, what other fields to include, what sections the body has) is left to the producer. The spec defines the interoperability surface, not the content model.\n\n**2\\. Producer/consumer independence.** OKF cleanly separates who writes the knowledge from who consumes it. A bundle hand-authored by a human can be consumed by an AI agent. A bundle generated by a metadata export pipeline can be browsed in a visualizer. A bundle synthesized by one LLM can be queried by another. The format is the contract; the tooling at each end is independently swappable.\n\n**3\\. Format, not platform.** OKF is not tied to any specific cloud, database, model provider, or agent framework. It will never require a proprietary account or SDK to read, write, or serve. We're publishing it as an open standard because the value of a knowledge format comes from how many parties speak it, not from who owns it.\n\n### What we're shipping with the spec\n\nTo make the format concrete, we're publishing **reference implementations** at both the producer and consumer ends:\n\n-   An **enrichment agent** that walks a BigQuery dataset, drafts an OKF concept document for every table and view, then runs a second LLM pass that crawls authoritative documentation and enriches each concept with citations, schemas, and join paths.\n    \n-   A **static HTML visualizer** that turns any OKF bundle into an interactive graph view in a single self-contained file; no backend, no install on the viewing side, no data leaves the page.\n    \n-   **Three ready-to-browse sample bundles**: [GA4 e-commerce](https://developers.google.com/analytics/bigquery/web-ecommerce-demo-dataset), [Stack Overflow](https://console.cloud.google.com/bigquery?ws=!1m4!1m3!3m2!1sbigquery-public-data!2sstackoverflow), and [Bitcoin public datasets](https://cloud.google.com/blog/topics/public-datasets/bitcoin-in-bigquery-blockchain-analytics-on-public-data?e=48754805), produced by the reference agent and committed to the repo as living examples of conformant OKF.\n    \n\nThese are proofs of concept, deliberately. The agent demonstrates one way to produce OKF; nothing about the format requires a specific agent framework or LLM. The visualizer demonstrates one way to consume it; nothing about the format requires HTML or a graph view. We expect (and want!) the ecosystem of producers and consumers to grow far beyond what we've shipped.\n\n### Where we go from here\n\nOKF v0.1 is a starting point, not a finished standard. The format will evolve as more producers and consumers emerge and as we collectively learn what knowledge representations agents actually need in practice.\n\nWe're publishing in the open from day one because that's the only way a knowledge format earns its name, whether you're building a knowledge catalog, an enrichment pipeline, a wiki tailored to AI agents, or anything in the AI knowledge domain.\u00a0\n\nFrom here, we encourage you to:\n\n-   **Read the spec** (it's short!)\n    \n-   **Write a producer** for your source system, your database, your documentation site\n    \n-   **Write a consumer:** a viewer, a search index, an agent that reasons over bundles\n    \n-   **Try the reference implementation** against your own data\n    \n-   **File issues, send PRs, or propose extensions:** The spec is versioned and explicitly designed for backward-compatible growth\n    \n\nThe repo, the spec, and the sample bundles are available in [GitHub](https://github.com/GoogleCloudPlatform/knowledge-catalog/tree/main/okf). We have also updated Google Cloud\u2019s [Knowledge Catalog](https://cloud.google.com/blog/products/data-analytics/introducing-the-google-cloud-knowledge-catalog) to be able to ingest Open Knowledge Format and serve it to our agents. You can find the relevant code and examples [here](https://github.com/GoogleCloudPlatform/knowledge-catalog/tree/main/toolbox/mdcode/demo).\n\nThe format itself is the contribution. The tools we've shipped exist to make it real, and to lower the cost of trying it out. Whatever shape your knowledge takes today, OKF is designed to be the lingua franca it can be exchanged for tomorrow.\u00a0\n\n---\n\nPublished by the Google Cloud Data Cloud team. Open Knowledge Format is an open specification; contributions, alternative implementations, and adoption beyond Google products are all explicitly welcomed.\n\nIn addition to the authors, this work came together thanks to key ideas from many others at Google, and we thank them for their contributions.\n\nPosted in\n\n-   [Data Analytics](https://cloud.google.com/blog/products/data-analytics)\n-   [AI & Machine Learning](https://cloud.google.com/blog/products/ai-machine-learning)\n-   [BigQuery](https://cloud.google.com/blog/products/bigquery)\n\n##### Related articles\n\n[\n\n![https://storage.googleapis.com/gweb-cloudblog-publish/images/09_-_Data_Analytics_tFH57V6.max-700x700.jpg](https://storage.googleapis.com/gweb-cloudblog-publish/images/09_-_Data_Analytics_tFH57V6.max-700x700.jpg)\n\nData Analytics\n\n### The borderless Lakehouse: Bring AWS, Databricks and Snowflake data to your AI agents\n\nBy Sirish Chandrasekaran \u2022 6-minute read\n\n](https://cloud.google.com/blog/products/data-analytics/introducing-the-borderless-lakehouse)\n\n[\n\n![https://storage.googleapis.com/gweb-cloudblog-publish/images/09_-_Data_Analytics_tFH57V6.max-700x700.jpg](https://storage.googleapis.com/gweb-cloudblog-publish/images/09_-_Data_Analytics_tFH57V6.max-700x700.jpg)\n\nData Analytics\n\n### Bringing Conversational Analytics to your entire data ecosystem\n\nBy Richard Kuzma \u2022 5-minute read\n\n](https://cloud.google.com/blog/products/data-analytics/conversational-analytics-in-google-data-cloud-in-q326)\n\n[\n\n![https://storage.googleapis.com/gweb-cloudblog-publish/images/30_-_SAP_on_Google_Cloud_9UdZT2G.max-700x700.jpg](https://storage.googleapis.com/gweb-cloudblog-publish/images/30_-_SAP_on_Google_Cloud_9UdZT2G.max-700x700.jpg)\n\nSAP on Google Cloud\n\n### Announcing general availability of SAP Business Data Cloud Connect for BigQuery\n\nBy Snehanshu Shah \u2022 6-minute read\n\n](https://cloud.google.com/blog/products/sap-google-cloud/sap-and-google-cloud-launch-bdc-connect-for-bigquery)\n\n[\n\n![https://storage.googleapis.com/gweb-cloudblog-publish/images/09_-_Data_Analytics_tFH57V6.max-700x700.jpg](https://storage.googleapis.com/gweb-cloudblog-publish/images/09_-_Data_Analytics_tFH57V6.max-700x700.jpg)\n\nData Analytics\n\n### Open Knowledge format v0.2 tackles agentic trust\n\nBy Sam McVeety \u2022 9-minute read\n\n](https://cloud.google.com/blog/products/data-analytics/okf-v0-2-adds-trust-signals)", "external-sources/README": "# Open Knowledge Format (OKF)\n\n### \ud83d\udcd6 [Read the Open Knowledge Format v0.2 specification \u2192 SPEC.md](SPEC.md)\n\n> **This repository is primarily about the [Open Knowledge Format\n> (OKF)](SPEC.md).**\n>\n> OKF is a **universal, vendor-neutral format** for representing knowledge\n> as plain markdown files with YAML frontmatter. It is **not tied to any\n> particular agent, framework, model provider, or serving system**. The\n> goal is simple:\n>\n> - **Anyone can produce** OKF \u2014 humans authoring by hand, agents built on\n>   any framework (Google ADK, LangChain, custom), export pipelines from\n>   existing catalogs (Dataplex, Unity Catalog, Collibra, \u2026), or scripts\n>   walking a database.\n> - **Anyone can serve and consume** OKF \u2014 a static file server, a\n>   knowledge-management UI (Obsidian, Notion, MkDocs), an LLM loading\n>   files into context, a search index, or a graph viewer like the one\n>   bundled in this repo.\n>\n> The agent below is a **proof of concept** demonstrating *one* way to\n> produce OKF bundles automatically. The format itself is the\n> contribution; this agent and the visualizer exist to make the format\n> tangible at both ends \u2014 production and consumption.\n>\n> **See OKF in practice** \u2014 three ready-to-browse bundles produced by this\n> agent, checked into [`bundles/`](bundles/):\n>\n> - [`bundles/ga4/`](bundles/ga4/) \u2014 GA4 e-commerce dataset\n>   ([viz.html](bundles/ga4/viz.html))\n> - [`bundles/stackoverflow/`](bundles/stackoverflow/) \u2014 Stack Overflow\n>   public dataset ([viz.html](bundles/stackoverflow/viz.html))\n> - [`bundles/crypto_bitcoin/`](bundles/crypto_bitcoin/) \u2014 Bitcoin\n>   blocks/transactions ([viz.html](bundles/crypto_bitcoin/viz.html))\n> - [`bundles/acme_retail/`](bundles/acme_retail/) \u2014 Acme Retail\n>   ([viz.html](bundles/acme_retail/viz.html))\n\n## Why OKF?\n\nOKF represents catalog knowledge as plain markdown files with YAML\nfrontmatter, organized in a directory hierarchy. That choice unlocks a few\nproperties that are hard to get from a service-owned metadata store:\n\n- **Human- and agent-readable.** No SDK or query language stands between a\n  reader and the content. An engineer can `cat` a concept; an LLM can ingest\n  it verbatim into context.\n- **Version-controllable out of the box.** Bundles live in git. Pull\n  requests, line-by-line diffs, blame, and review workflows just work \u2014\n  knowledge curation becomes a normal software-engineering activity.\n- **Portable and lock-in free.** A bundle is a directory. Ship it as a\n  tarball, host it in any repo, mount it from any filesystem, or sync it to\n  any system that speaks files. No proprietary API stands between you and\n  your metadata.\n- **Mixes structured and unstructured data deliberately.** Use frontmatter\n  for the few fields you want to query, filter, or index on (`type`,\n  `resource`, `tags`, `generated`, `status`); use the markdown body for the\n  prose, schemas, and example queries that LLMs and humans actually read.\n- **Trust, provenance, and freshness are first-class.** v0.2 puts queryable\n  signals in frontmatter \u2014 where a concept came from (`sources` with per-source\n  credibility signals), who produced and confirmed it (`generated`, `verified`,\n  from which consumers derive a trust tier), and whether it is still current\n  (`status`, `stale_after`) \u2014 so an agent-maintained corpus stays trustable\n  without any bespoke runtime.\n- **Minimally opinionated, freely extensible.** A small set of required\n  keys ensures interoperability, but bundles can carry arbitrary extra\n  frontmatter keys and arbitrary body sections without breaking\n  consumers.\n- **Composes with existing tooling.** Many knowledge tools \u2014 Notion,\n  Obsidian, MkDocs, Hugo, Jekyll \u2014 already speak markdown plus YAML\n  frontmatter, so bundles can be browsed, edited, or rendered without\n  custom UI.\n- **Progressive disclosure built in.** Auto-generated `index.md` files\n  let an agent or human navigate the hierarchy one level at a time\n  instead of loading the entire bundle into context.\n- **Graph-shaped, not just tree-shaped.** Concepts link to each other via\n  normal markdown links, expressing relationships richer than the\n  parent/child implied by the directory layout.\n\nThe net effect is that reference agents, consumption agents, and humans\ncollaborate on the same artifacts in the same way they already collaborate\non source code.\n\n## Install\n\n```\npython3.13 -m venv .venv\n.venv/bin/pip install --index-url https://pypi.org/simple/ -e .[dev]\n```\n\n## Credentials\n\n- BigQuery: `gcloud auth application-default login` plus a project for billing\n  (`gcloud config set project <id>`). Public datasets are readable, but the\n  caller's project is billed for query bytes.\n- Gemini: set `GEMINI_API_KEY` (AI Studio) **or** use Vertex AI by setting\n  `GOOGLE_GENAI_USE_VERTEXAI=true`, `GOOGLE_CLOUD_PROJECT=<id>`, and\n  `GOOGLE_CLOUD_LOCATION=<region>`.\n\n## How the reference agent works\n\nThe reference agent runs in two passes. The **BQ pass** writes one OKF\ndoc per concept the source advertises, using BigQuery metadata alone.\nThe **web pass** then runs the LLM as its own crawler: it receives a\nlist of seed URLs (provided via `--web-seed` or `--web-seed-file`),\nfetches the seeds via the `fetch_url` tool, and decides which outbound\nlinks are worth following based on whether they look like authoritative\ndocumentation for the existing concepts. For each page it fetches, the\nagent chooses to (a) enrich one or more existing concept docs, (b) mint\na standalone `references/<slug>` doc, or (c) skip. A hard\n`--web-max-pages` cap and a same-domain allowed-hosts filter\n(configurable via `--web-allowed-host`) are enforced inside the tool,\nso the agent cannot overrun. Use `--no-web` to skip the web pass.\n\n## Run\n\nMinimum invocation \u2014 point at a BigQuery dataset and a bundle output\ndirectory. Seeds for the web pass are explicit; omit them (or pass\n`--no-web`) to run BQ-only:\n\n```\n.venv/bin/python -m reference_agent enrich \\\n    --source bq \\\n    --dataset <project>.<dataset> \\\n    --web-seed-file <path/to/seeds.txt> \\\n    --out ./bundles/<name>\n```\n\nIterate on a single concept by adding `--concept <type>/<name>` (e.g.\n`--concept tables/events_`); repeatable.\n\n## Samples\n\nEach sample pairs a **recipe** (`samples/<name>/`, with the seed URLs and\nexact `enrich` command) with the **produced bundle** (`bundles/<name>/`)\nthat the recipe generated. Open the recipe to reproduce; open the bundle\nto browse the result directly.\n\n- **GA4 Google Merchandise Store** \u2014 public e-commerce dataset, seeded\n  with canonical GA4 BigQuery Export documentation URLs.\n  \u00b7 [recipe](samples/ga4_merch_store/README.md)\n  \u00b7 [bundle](bundles/ga4/)\n  \u00b7 [viz.html](bundles/ga4/viz.html)\n- **Stack Overflow** \u2014 public dataset (mirror of the Stack Exchange Data\n  Dump), seeded with the community's canonical schema references.\n  Exercises multi-concept enrichment from cross-cutting docs pages.\n  \u00b7 [recipe](samples/stackoverflow/README.md)\n  \u00b7 [bundle](bundles/stackoverflow/)\n  \u00b7 [viz.html](bundles/stackoverflow/viz.html)\n- **Bitcoin (crypto)** \u2014 public dataset (blocks, transactions, inputs,\n  outputs) from the `bitcoin-etl` pipeline. Exercises cross-table\n  foreign-key relationships in prose.\n  \u00b7 [recipe](samples/crypto_bitcoin/README.md)\n  \u00b7 [bundle](bundles/crypto_bitcoin/)\n  \u00b7 [viz.html](bundles/crypto_bitcoin/viz.html)\n\n## Visualize\n\nThe `visualize` subcommand renders any OKF bundle as a **self-contained\ninteractive HTML file** \u2014 one file, no backend, no install on the\nviewing side. Open it in any modern browser, share it as an artifact,\nhost it on a static file server, or commit it next to the bundle (as\nthis repo does).\n\nThe viewer is itself a proof-of-concept *consumer* of OKF, mirroring\nthe way the reference agent is a proof-of-concept *producer*. OKF\nbundles can be consumed by anything that reads markdown; this is just\none shape.\n\n### What it shows\n\n- A **force-directed graph** of every concept in the bundle, with\n  colored nodes by type (datasets, tables, references, \u2026) and directed\n  edges drawn from each cross-link in the markdown bodies.\n- A **detail panel** for the selected concept showing its frontmatter\n  (description, resource link, tags) and its rendered markdown body \u2014\n  with internal `[\u2026](/path/to/concept.md)` links rewired to navigate\n  within the viewer instead of following the path.\n- A **\"Cited by\" backlinks** list under each concept (computed from the\n  reverse of the link graph).\n- A **search box** (matches title, concept id, and tags), a **type\n  filter**, and switchable graph layouts (cose / concentric /\n  breadth-first / circle / grid).\n\n### Generate\n\n```\n.venv/bin/python -m reference_agent visualize --bundle ./bundles/<name>\n```\n\nThat writes `bundles/<name>/viz.html`. Flags:\n\n| Flag           | Default                | Description                                 |\n|----------------|------------------------|---------------------------------------------|\n| `--bundle`     | *(required)*           | Bundle root directory.                      |\n| `--out`        | `<bundle>/viz.html`    | Output HTML path.                           |\n| `--name`       | bundle directory name  | Display name shown in the viewer header.    |\n\nExample, writing the output somewhere else and overriding the header:\n\n```\n.venv/bin/python -m reference_agent visualize \\\n    --bundle ./bundles/crypto_bitcoin \\\n    --out /tmp/btc.html \\\n    --name \"Bitcoin OKF\"\n```\n\n### How it's built\n\nThe HTML embeds the bundle as a JSON blob and uses\n[Cytoscape.js](https://js.cytoscape.org/) for the graph and\n[marked](https://marked.js.org/) for in-browser markdown rendering,\nboth loaded from a CDN. No data leaves the page; the bundle is parsed\nonce at generation time and serialized into the file.\n\n## Tests\n\n```\n.venv/bin/pytest\n```", "external-sources/SPEC": "# Open Knowledge Format (OKF)\n\n**Version 0.2**\n\nOKF is an open, human- and agent-friendly format for representing\n*knowledge*: the metadata, context, and curated insight that surrounds\ndata and systems. It is designed to be authored by people, generated by\nagents, exchanged across organizations, and consumed by both.\n\nThe format is intentionally minimal: a directory of markdown files with\nYAML frontmatter. There is no schema registry, no central authority, and\nno required tooling. If you can `cat` a file, you can read OKF; if you\ncan `git clone` a repo, you can ship it.\n\nThis document is self-contained: it specifies everything needed to\nproduce and consume OKF v0.2. A summary of what changed from v0.1 is in\n\u00a713.\n\n---\n\n## 1. Motivation\n\nThe space of knowledge representation for AI agents is evolving quickly,\nand many incompatible conventions are emerging. OKF takes the position\nthat knowledge is best represented in commonly accessible, established\nformats that are:\n\n- **Readable** by humans without tooling.\n- **Parseable** by agents without bespoke SDKs.\n- **Diffable** in version control.\n- **Portable** across tools, organizations, and time.\n\nIncreasingly, a knowledge corpus is not authored once and then read: it\nis **continuously written and maintained by agents**. When most concepts \nare machine-generated, a consumer needs answers that a plain \nmarkdown-plus-frontmatter convention does not make first-class:\n\n1. What was this created from, and how was it verified? (**provenance**)\n2. How much should I trust it? (**trust**)\n3. Is it still true? (**freshness**)\n4. Is it the current version? (**lifecycle**)\n5. Was this number produced the way we said it must be? (**attestation**)\n\nOKF v0.2 makes provenance, trust, lifecycle, and attestation first-class\nwhile keeping the format minimally opinionated. The format is minimally \nopinionated. It standardizes only the small set of structural conventions \nneeded to make a knowledge corpus self-describing \u2014 anything beyond that\nis left to the producer.\n\n### Goals\n\n1. Define a universal format that **producers** (people, agents, export\n   pipelines) can write into.\n2. Inform how **consumers** (agents, UIs, search indexes, deterministic\n   code) should read and traverse it.\n3. Facilitate **exchange** of knowledge across systems and organizations.\n4. Standardize the small set of frontmatter fields that make an\n   agent-maintained corpus **trustable**, without prescribing any runtime.\n\n### Non-goals\n\n- Defining a fixed taxonomy of concept types.\n- Prescribing storage, serving, or query infrastructure.\n- Replacing domain-specific schemas (Avro, Protobuf, OpenAPI, and so on).\n  OKF *references* them; it does not subsume them.\n- Specifying a packaging or invocation standard for the code an executor\n  or attester points at. OKF fixes the interface, not the packaging.\n\n---\n\n## 2. Terminology\n\n- **Knowledge Bundle** (or **bundle**): A self-contained, hierarchical\n  collection of knowledge documents. The unit of distribution.\n- **Concept**: A single unit of knowledge within a bundle, represented as\n  one markdown document. It may describe a tangible asset (a table, an\n  API), an abstract idea (a metric, a business process), or anything in\n  between.\n- **Concept ID**: The path of the concept's file within the bundle, with\n  the `.md` suffix removed.\n- **Frontmatter**: A YAML metadata block delimited by `---` at the top of\n  a markdown file.\n- **Body**: Everything in the file after the frontmatter.\n- **Link**: A standard markdown link from one concept to another, used to\n  express relationships beyond the implicit parent/child hierarchy.\n- **Source**: A material a concept derives from, external or internal to\n  the bundle, recorded in the `sources` frontmatter field.\n- **Provenance**: The set of sources a concept derives from.\n- **Credibility signal**: An objective, per-source fact (`author`,\n  `usage_count`, `last_modified`) used to infer trust; OKF records the\n  signals, not a verdict (see \u00a75.1).\n- **Actor**: A string identifying who or what performed an action, using\n  the convention `<producer>/<version>` for agents, `human:<id>` for\n  people, and `process:<id>` for automated processes (see \u00a77).\n- **Trust tier**: A level derived from a concept's `verified` field:\n  unverified, machine-confirmed, or human-reviewed (see \u00a75.3).\n- **Attested Computation**: A concept (`type: Attested Computation`)\n  carrying a sanctioned way to compute a value, so a consumer can confirm\n  the value was produced by running it (see \u00a710).\n- **Executor**: Run instructions or code that executes a computation and\n  returns a receipt (see \u00a710.2).\n- **Receipt**: The evidence a run returns, shaped by `executor.receipt`; a\n  runtime artifact, not stored in the bundle (see \u00a710).\n- **Attester**: Deterministic (no-LLM) code that inspects a receipt and\n  returns a verdict (see \u00a710.2).\n\n---\n\n## 3. Bundle structure\n\nA bundle is a directory tree of markdown files. The directory structure\nis independent of the domain: producers organize concepts however makes\nsense for the knowledge being captured.\n\n```\npath/to/bundle/\n  index.md                      # Optional. Directory listing for progressive disclosure.\n  log.md                        # Optional. Chronological history of updates.\n  <concept>.md                  # A concept at the bundle root.\n  <subdirectory>/               # Subdirectories organize concepts into groups.\n    index.md\n    <concept>.md\n    <subdirectory>/\n      ...\n```\n\nA bundle MAY be distributed as:\n\n- A git repository (recommended, since it provides history, attribution,\n  and diffs).\n- A tarball or zip archive of the directory.\n- A subdirectory within a larger repository.\n\n### 3.1 Reserved filenames\n\nThe following filenames have defined meaning at any level of the\nhierarchy and MUST NOT be used for concept documents:\n\n| Filename   | Purpose                          |\n|------------|----------------------------------|\n| `index.md` | Directory listing. See \u00a78.       |\n| `log.md`   | Update history. See \u00a79.          |\n\nAll other `.md` files are concept documents.\n\nTags remain a first-class concept through the `tags` frontmatter field\n(\u00a74.1). OKF does not specify a separate file format for aggregating\ndocuments by tag; a consumer that wants a tag-browsing view can\nsynthesize one at consumption time by scanning frontmatter.\n\n---\n\n## 4. Concept documents\n\nEvery concept is a UTF-8 markdown file with two parts:\n\n1. A **YAML frontmatter block**, delimited by `---` on its own line at the\n   start of the file and a closing `---` on its own line.\n2. A **markdown body**, containing free-form content.\n\n### 4.1 Frontmatter\n\n```yaml\n---\ntype: <Type name>                  # REQUIRED\ntitle: <Optional display name>\ndescription: <Optional one-line summary>\nresource: <Optional canonical URI for the underlying asset>\ntags: [<tag>, <tag>, ...]          # Optional\n# ... trust, lifecycle, provenance, and computation families (see \u00a75, \u00a710)\n# ... other producer-defined key/value pairs\n---\n```\n\n**Required:**\n\n- `type`: A short string identifying the kind of concept. Consumers use it\n  for routing, filtering, and presentation. Example values:\n  `BigQuery Table`, `BigQuery Dataset`, `API Endpoint`, `Metric`,\n  `Playbook`, `Reference`, `Attested Computation`.\n\n  Type values are **not** registered centrally. Producers SHOULD pick\n  values that are descriptive and self-explanatory; consumers MUST\n  tolerate unknown types gracefully, typically by treating them as generic\n  concepts.\n\n`type` is the only always-required key; a concept carrying just `type` is\nfully conformant (\u00a711).\n\n**Recommended:**\n\n- `title`: Human-readable display name. If omitted, consumers MAY derive a\n  title from the filename.\n- `description`: A single sentence summarizing the concept. Used by\n  `index.md` generators, search snippets, and previews.\n- `resource`: A URI that uniquely identifies the underlying asset the\n  concept describes. Absent for concepts that describe abstract ideas\n  rather than physical resources.\n- `tags`: A YAML list of short strings for cross-cutting categorization.\n\nThe optional **provenance**, **trust**, and **lifecycle** families (\u00a75) and\nthe **computation** fields for Attested Computation concepts (\u00a710) may also\nappear.\n\n**Extensions:** Producers MAY include any additional keys. Consumers\nSHOULD preserve unknown keys when round-tripping and MUST NOT reject\ndocuments with unrecognized fields.\n\n### 4.2 Body\n\nThe body is standard markdown. Producers SHOULD favor structural markdown\n(headings, lists, tables, fenced code blocks) over freeform prose, since\nstructure aids both human reading and agent retrieval.\n\nThere are no required body sections. The following headings have\n**conventional** meaning and SHOULD be used when applicable:\n\n| Heading         | Purpose                                                |\n|-----------------|--------------------------------------------------------|\n| `# Schema`      | Structured description of an asset's columns/fields.   |\n| `# Examples`    | Concrete usage examples, often as fenced code blocks.  |\n| `# Computation` | The sanctioned computation of an Attested Computation. See \u00a710. |\n\nPer-claim attribution to external sources uses markdown footnotes keyed to\n`sources` entries rather than a body citations list (\u00a75.1).\n\n### 4.3 Example: a concept bound to a resource\n\n```markdown\n---\ntype: BigQuery Table\ntitle: Customer Orders\ndescription: One row per completed customer order across all channels.\nresource: https://console.cloud.google.com/bigquery?p=acme&d=sales&t=orders\ntags: [sales, orders, revenue]\ngenerated: { by: reference_agent/gemini-2.5-pro, at: 2026-05-28T14:30:00Z }\n---\n\n# Schema\n\n| Column        | Type      | Description                              |\n|---------------|-----------|------------------------------------------|\n| `order_id`    | STRING    | Globally unique order identifier.        |\n| `customer_id` | STRING    | Foreign key into [customers](/tables/customers.md). |\n| `total_usd`   | NUMERIC   | Order total in US dollars.               |\n| `placed_at`   | TIMESTAMP | When the customer submitted the order.   |\n\n# Joins\n\nJoined with [customers](/tables/customers.md) on `customer_id`.\n```\n\n### 4.4 Example: a concept not bound to a resource\n\n```markdown\n---\ntype: Playbook\ntitle: \"Incident response: data freshness alert\"\ndescription: Steps to triage a freshness alert on the orders pipeline.\ntags: [oncall, incident]\ngenerated: { by: human:ahormati, at: 2026-04-12T09:00:00Z }\n---\n\n# Trigger\n\nA freshness alert fires when `orders` lags more than 30 minutes behind its\nexpected SLA. See the [orders table](/tables/orders.md).\n\n# Steps\n\n1. Check the [ingestion job dashboard](https://example.com/dash).\n2. ...\n```\n\n---\n\n## 5. Provenance, trust, and lifecycle\n\nThese frontmatter families make \"where did this come from,\" \"how much\nshould I trust it,\" and \"is it still current\" answerable from frontmatter.\nAll are optional. Their absence carries meaning: an unverified concept is\ndistinguishable from a verified one, but is never rejected (\u00a711).\n\n### 5.1 Provenance: `sources`\n\n`sources` records the materials a concept derives from, external or\ninternal to the bundle.\n\n```yaml\nsources:\n  - id: ga4-schema\n    resource: https://developers.google.com/analytics/bigquery/export-schema\n    title: GA4 BigQuery Export schema\n    author: team:ga4-docs\n    usage_count: 5000\n    last_modified: 2026-05-30\nusage_window: { from: 2026-06-01, to: 2026-06-30 }\n```\n\nEach `sources` entry:\n\n- `resource`: REQUIRED within an entry. Names either a concrete artifact a\n  consumer can follow (an absolute URL, a bundle-relative path, or a path\n  into a `references/` subdirectory, \u00a76) or a population or scope descriptor\n  it cannot (for example `all queries in BigQuery project X`).\n- `id`: Optional. A stable key used to attribute individual claims (see\n  below). SHOULD be present when the body cites the source.\n- `title`: Optional. Human-readable label for the source.\n- The optional credibility signals `author`, `usage_count`, and\n  `last_modified`, described next.\n\n**Source credibility signals.** OKF records objective, per-source signals\nso a consumer can judge how much to trust a concept by judging the sources\nit was extracted from. It does not store a credibility score: a score is\nsubjective, unportable across consumers, and goes stale. Credibility is\n*inferred* from the signals, the same way trust tiers are (\u00a75.3), not\nstored. Each signal is optional and lives on a `sources` entry:\n\n- `author`: Who or what produced the source, in the actor convention (\u00a77).\n  An authority signal.\n- `usage_count`: How often `resource` was exercised (dashboard views, query\n  executions, page reads) over `usage_window`. An adoption and liveness\n  signal. For a single artifact it is that artifact's own exercise count;\n  for a scope descriptor it is the number of exercises within the scope that\n  touch the concept.\n- `last_modified`: When the source itself last changed (`YYYY-MM-DD`). A\n  recency signal, distinct from `generated.at` (\u00a75.2), which records when\n  the concept was written.\n- `usage_window`: Written once as a sibling of `sources`, it frames every\n  `usage_count` with a `{ from, to }` date range. A single entry MAY carry\n  its own `usage_window` to override the shared one.\n\n`usage_count` is a coarse signal. It is comparable at the\nalive-versus-dead and order-of-magnitude level, and against a source's own\nhistory over time, but not as a precise cross-kind ranking: a scheduled\nquery's executions and a human's deliberate dashboard views do not carry\nequal weight. Consumers SHOULD read it as liveness and trend, not as a\nscore.\n\nLineage is expressed through links, not a dedicated field. When a\n`resource` points at another OKF concept, the derivation edge already\nexists in the bundle graph (\u00a76), so a consumer MAY recurse into that\nsource's own `sources` and let credibility propagate. External leaf sources\ncarry only their intrinsic signals. Deeper lineage (an explicit external\n`derived_from`, or data lineage) is out of scope for v0.2.\n\n**Per-claim attribution.** To attribute a specific claim, use a markdown\nfootnote whose label is a `sources[].id`:\n\n```markdown\nThe `events_` table is sharded daily as `events_YYYYMMDD`.[^ga4-schema]\n\n[^ga4-schema]: GA4 BigQuery Export schema\n```\n\nThe footnote label is the join key into `sources`; consumers resolve\nattribution through the matching entry, not by parsing the footnote prose.\nLabels are keyed rather than positional (`sources[0]`) because agents\nconstantly rewrite these documents: a positional index misattributes\nsilently the moment the list is reordered, whereas a stable `id` survives\nreordering.\n\n### 5.2 Trust: `generated` and `verified`\n\n`generated` records how the current content was produced. `verified`\nrecords who or what has confirmed the content against its sources or\n`resource`. They are kept distinct because who *wrote* a concept need not\nbe who *confirmed* it.\n\n```yaml\ngenerated: { by: reference_agent/gemini-2.5-pro, at: 2026-06-20T22:53:05Z }\n```\n\n- `generated.by`: REQUIRED within `generated`. An actor (\u00a77).\n- `generated.at`: An ISO 8601 datetime marking the content's last\n  meaningful change. Consumers use it to tell a recent edit from a stale\n  fact.\n\n```yaml\nverified:\n  - { by: human:ahormati, at: 2026-06-25T09:00:00Z }\n  - { by: process:finance-nightly, at: 2026-06-26T02:00:00Z }\n```\n\n- `verified`: A list of verification events, each with `by` (an actor) and\n  `at` (an ISO 8601 datetime). Multiple entries capture independent\n  checks, for example a human sign-off plus a nightly process. \"How\n  recently\" is the latest `at`.\n- `verified` is independent of `generated.at`: content can change without\n  re-confirmation, and facts can be re-confirmed without regeneration.\n- A single verifier MAY be written as one `{ by, at }` mapping without the\n  list dash. Consumers MUST treat a bare mapping as a one-element list:\n\n```yaml\nverified: { by: human:ahormati, at: 2026-06-25T09:00:00Z }\n```\n\n### 5.3 Trust tiers\n\nConsumers derive a trust tier from `verified`, lowest to highest:\n\n- No `verified` key \u21d2 **unverified**.\n- `verified` by non-`human:` actors only \u21d2 **machine-confirmed**.\n- `verified` by a `human:<id>` actor \u21d2 **human-reviewed**.\n\nA concept with no trust frontmatter is still consumable; consumers MUST\nNOT reject it (\u00a711). Trust tiers are advisory signals, not access control.\n\n### 5.4 Lifecycle: `status`\n\n```yaml\nstatus: stable        # draft | stable | deprecated\n```\n\n- `draft`: not yet reviewed; possibly incomplete.\n- `stable`: default; ready for consumption.\n- `deprecated`: kept for links and history; no longer current.\n\nAbsent `status` \u21d2 `stable`.\n\n### 5.5 Lifecycle: `stale_after`\n\n```yaml\nstale_after: 2026-09-23   # absolute date; content is stale on/after this day\n```\n\nOptional. An absolute date (`YYYY-MM-DD`). A concept is stale when\n`today >= stale_after`. An absolute date, not a relative TTL, keeps the\nstaleness decision a plain date comparison with no reference to when the\nconcept was read.\n\n---\n\n## 6. Cross-linking and paths\n\n### 6.1 Links between concepts\n\nConcepts MAY link to other concepts using standard markdown links. Two\nforms are supported:\n\n- **Absolute (bundle-relative):** begins with `/`, interpreted relative to\n  the bundle root. This is the **recommended** form because it is stable\n  when documents are moved within their subdirectory.\n\n  ```markdown\n  See the [customers table](/tables/customers.md) for the join key.\n  ```\n\n- **Relative:** a standard markdown relative path.\n\n  ```markdown\n  See the [neighboring concept](./other.md).\n  ```\n\nA link from concept A to concept B asserts a *relationship*. The specific\nkind (parent/child, references, joins-with, depends-on) is conveyed by the\nsurrounding prose, not by the link itself. Consumers that build a graph\nview typically treat all links as directed edges of an untyped\nrelationship.\n\nConsumers MUST tolerate broken links: a link whose target does not exist\nin the bundle is not malformed; it may simply represent not-yet-written\nknowledge.\n\n### 6.2 Path-valued fields\n\nSeveral fields name a path or URI: `resource`, `sources[].resource`,\n`computation`, `executor.resource`, and `attester.resource` (\u00a710). A\n`sources[].resource` may instead be a scope descriptor (\u00a75.1), in which\ncase it is not a path. Each path-valued field accepts:\n\n- an absolute URL (for example `https://...`),\n- a bundle-relative path beginning with `/`, or\n- a relative path (for example `../computations/revenue.md`).\n\n### 6.3 The `references/` convention\n\nA `references/` subdirectory conventionally mirrors external material, run\ninstructions, or code as first-class concepts within the bundle. Sources,\nexecutors, and attesters commonly point into it (for example\n`references/attesters/revenue.py`). It is a naming convention, not a\nrequirement.\n\n---\n\n## 7. Actor convention\n\nFields that record an identity (`generated.by`, `verified[].by`) use a\nsingle actor convention:\n\n- `<producer>/<version>` for agents and tools, for example\n  `reference_agent/gemini-2.5-pro`.\n- `human:<id>` for a person, for example `human:ahormati`.\n- `process:<id>` for an automated process, for example\n  `process:finance-nightly`.\n\nConsumers that classify trust (\u00a75.3) key off the `human:` prefix, so\nproducers MUST use it for hand-authored or human-confirmed content.\n\n---\n\n## 8. Index files\n\nAn `index.md` file MAY appear in any directory, including the bundle root.\nIt enumerates the directory's contents to support **progressive\ndisclosure**: letting a human or agent see what is available before\nopening individual documents.\n\nIndex files contain no frontmatter, with one exception: a bundle-root\n`index.md` MAY carry an `okf_version` key (\u00a712). The body uses one or more\nsections, each grouping concepts under a heading:\n\n```markdown\n# Section / Group Heading\n\n* [Title 1](relative-url-1) - short description of item 1\n* [Title 2](relative-url-2) - short description of item 2\n\n# Another Section\n\n* [Subdirectory](subdir/) - short description of the subdirectory\n```\n\nEntries SHOULD include the description from the linked concept's\nfrontmatter. Producers MAY generate `index.md` automatically; consumers\nMAY synthesize one on the fly when none is present.\n\n---\n\n## 9. Log files\n\nA `log.md` file MAY appear at any level of the hierarchy to record the\nhistory of changes to that scope. The format is a flat list of\ndate-grouped entries, newest first:\n\n```markdown\n# Directory Update Log\n\n## 2026-05-22\n* **Update**: Added a BigQuery table reference for [Customer Metrics](/tables/customer-metrics.md).\n* **Creation**: Established the [Dataplex Playbook](/playbooks/dataplex.md).\n\n## 2026-05-15\n* **Initialization**: Created foundational directory structure.\n```\n\nDate headings MUST use ISO 8601 `YYYY-MM-DD` form. Log entries are prose;\nthe leading bold word (`**Update**`, `**Creation**`, `**Deprecation**`) is\na convention, not a requirement.\n\n---\n\n## 10. Attested computations concept\n\nAn Attested Computation concept carries not just what a value *means* but a\nsanctioned way to *compute* it, so a consumer can confirm the agent ran the\nblessed computation instead of improvising its own. Provenance (\u00a75.1)\nanswers \"where did this claim come from\"; attestation answers \"was this\nnumber produced the way we said it must be.\" OKF records the computation\nand the means to check it; it does not execute anything itself.\n\n### 10.1 A computation is its own concept\n\nA sanctioned computation is a standalone concept of\n`type: Attested Computation`. A concept that needs the value (a `Metric`, a\n`BigQuery Table`) links to it with a normal markdown link (\u00a76). Three\nproperties motivate the standalone concept:\n\n- **`runtime` defines what `parameters` mean.** A parameter is a SQL bind\n  variable, a dbt var, or a Python argument depending on the runtime.\n  Keeping `runtime` and `parameters` in one frontmatter makes the binding\n  semantics self-evident.\n- **One computation, many consumers.** The same computation can back a\n  metric, a dashboard concept, and a report; as a concept it is referenced\n  once and reused.\n- **Trust state is per computation.** `verified`, `stale_after`, and a\n  single `attester` describe one thing. Revenue, profit, and margin each\n  verify and attest independently, which is three concepts, not three\n  entries in one frontmatter.\n\n### 10.2 Contract fields\n\nThe contract is the concept's top-level frontmatter. In addition to the\nprovenance, trust, and lifecycle families (\u00a75), an Attested Computation\nconcept carries:\n\n- `runtime`: REQUIRED for this type. The single field that says how to run\n  the computation, and so how the executor and attester interpret it and\n  what `parameters` mean. Example values: `bigquery`, `postgres`, `dbt`,\n  `python`, `Looker`.\n- `parameters`: A list of the typed, named holes the agent may fill. Each\n  entry: `{ name, type, required }`. Binding semantics follow `runtime`.\n- `computation`: Optional. A path (\u00a76.2) to a file holding the\n  computation, used instead of an inline body fence (see \u00a710.3). Absent \u21d2\n  the body `# Computation` fence is the computation.\n- `executor`: How the computation is run. `resource` names run\n  instructions or code; a runner (an agent, or deterministic consumer\n  code) follows it. `receipt` declares the fields a run must return, the\n  evidence the attester inspects (for example a BigQuery `job_id` and the\n  SQL the job actually executed).\n- `attester`: The deterministic check. `resource` names code (no LLM) that\n  takes a receipt and returns a verdict. It is meant to run consumer-side.\n\nWhat sits behind a `resource` (a Skill, a script, a container) is a\npackaging choice; OKF fixes the interface, not the packaging (\u00a71).\n\n```markdown\n---\ntype: Attested Computation\ntitle: Revenue for fiscal year\ndescription: Recognized revenue for a fiscal year, per Finance's definition.\nstatus: stable\nruntime: bigquery\nparameters:\n  - { name: year, type: integer, required: true }\nexecutor:\n  resource: references/skills/run-on-bq.md\n  receipt: [job_id, executed_sql, result]\nattester:\n  resource: references/attesters/revenue.py\ngenerated: { by: reference_agent/gemini-2.5-pro, at: 2026-06-20T22:53:05Z }\nverified: { by: human:ahormati, at: 2026-06-25T09:00:00Z }\nstale_after: 2026-09-23\nsources:\n
